name: EarnRoute tests and Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'migrations/**'
      - 'android/**'
      - 'requirements.txt'
      - 'alembic.ini'
      - '.github/workflows/earnroute-android.yml'

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Test backend and frontend source
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q app tests scripts
          node --check app/static/app.js
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
      - name: Accept licences and install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Sync current web app into Android assets
        run: ./sync-assets.sh
        working-directory: android
      - name: Build installable debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
        working-directory: android
      - name: Upload installable Android APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
