services:
  - type: web
    name: earnroute-api
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: earnroute-postgres
          property: connectionString
      - key: CORS_ORIGINS
        value: https://appassets.androidplatform.net
      - key: DEFAULT_PLATFORM_FEE_PERCENT
        value: "12"
      - key: MARKET_TIMEZONE
        value: Asia/Kolkata

databases:
  - name: earnroute-postgres
    databaseName: earnroute
    user: earnroute
    plan: free
    postgresMajorVersion: "16"
