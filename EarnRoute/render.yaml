services:
  - type: web
    name: earnroute-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Required secret from the existing Neon PostgreSQL database.
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        value: https://appassets.androidplatform.net,https://earnroute-api.onrender.com,https://earnroute-nearby-api.onrender.com
      - key: DEFAULT_PLATFORM_FEE_PERCENT
        value: "12"
      - key: MARKET_TIMEZONE
        value: Asia/Kolkata
