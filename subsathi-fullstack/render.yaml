services:
  - type: web
    name: subsathi-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: subsathi-db
          property: connectionString
      # Add GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET and GOOGLE_REDIRECT_URI
      # in the Render dashboard after the first health-checked deployment.
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:8081,http://localhost:19006
      - key: SESSION_DAYS
        value: "14"
databases:
  - name: subsathi-db
    databaseName: subsathi
    user: subsathi
    plan: free