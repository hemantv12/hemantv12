name: EarnRoute signed Android release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Require owner-managed signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret for $name. See EarnRoute/OWNER-SETUP-44.md."
              exit 1
            fi
          done
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/earnroute-release.jks"
          chmod 600 "$RUNNER_TEMP/earnroute-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/earnroute-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Build signed APK and AAB
        working-directory: EarnRoute/android
        run: gradle --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-signed-release
          path: |
            EarnRoute/android/app/build/outputs/apk/release/app-release.apk
            EarnRoute/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
