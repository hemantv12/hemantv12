name: CMS smoke checks

on:
  push:
    branches:
      - rti-growth-studio-launch
    paths:
      - 'studio-cms/**'
      - 'rti-growth-studio/**'
      - '.github/workflows/cms-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check website and admin JavaScript syntax
        run: |
          set -euo pipefail
          node --check studio-cms/server.js
          node --check rti-growth-studio/assets/aa-studio.js
          node --check rti-growth-studio/assets/cms-client.js
          node --check rti-growth-studio/assets/growth-lab.js
          node --check rti-growth-studio/assets/motion-system.js
          node --check rti-growth-studio/assets/neon-rush.js
          node --check rti-growth-studio/assets/visitor-analytics.js
          node --check rti-growth-studio/admin/admin.js
          grep -q "app.delete('/api/admin/media/:id'" studio-cms/server.js
          grep -q 'delete-media:' rti-growth-studio/admin/admin.js
          grep -q 'clear-media-field' rti-growth-studio/admin/admin.js
          echo "Backend, public-site and admin JavaScript syntax checks passed."

      - name: Wait for CMS API and validate public data
        env:
          CMS_API_URL: https://aa-growth-studio-cms-api.onrender.com/api
          SITE_URL: https://rti-growth-studio.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --connect-timeout 8 --max-time 12 -fsS "$CMS_API_URL/health" >/tmp/cms-health.json; then
              break
            fi
            if [ "$attempt" -eq 18 ]; then
              echo "CMS API did not become healthy after retries."
              exit 1
            fi
            echo "Waiting for CMS API rollout ($attempt/18)..."
            sleep 10
          done
          node -e "const h=require('/tmp/cms-health.json'); if(h.ok!==true) process.exit(1); console.log('Health OK:',h.service)"
          curl --connect-timeout 8 --max-time 15 -fsS "$CMS_API_URL/public/site" >/tmp/cms-site.json
          # An empty request must reach the real lead handler and return its validation error,
          # not the catch-all 404 ("API route not found"). This does not create a lead record.
          enquiry_status=$(curl --connect-timeout 8 --max-time 15 -sS -o /tmp/cms-enquiry-route.json -w '%{http_code}' -X POST "$CMS_API_URL/public/enquiries" -H "Origin: $SITE_URL" -H 'Content-Type: application/json' --data '{}')
          test "$enquiry_status" = "400"
          grep -q 'Please enter your name' /tmp/cms-enquiry-route.json
          echo "Public enquiry route OK: validation handler responded (no test lead saved)."
          curl --connect-timeout 8 --max-time 15 -fsS "$CMS_API_URL/public/meta/pixel" >/tmp/cms-meta-pixel.json
          node -e "const d=require('/tmp/cms-meta-pixel.json'); if(typeof d.pixelId!=='string') process.exit(1); console.log('Public Meta pixel config endpoint OK')"
          node <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync('/tmp/cms-site.json', 'utf8'));
          if (!data.settings || !Array.isArray(data.services) || data.services.length < 1) {
            throw new Error('Public site endpoint is missing settings or service entries.');
          }
          if (!Array.isArray(data.settings.portfolioItems)) {
            throw new Error('Portfolio collection is missing from public settings.');
          }
          const members = (data.settings.teamMembers || []).filter(m => m && m.visible !== false && m.name && m.role);
          if (members.length < 3 || !members.some(m => m.name === 'Apurba Ruidas') || !members.some(m => m.name === 'Divyanshu Bhargava') || !members.some(m => m.name === 'Arya Rupesh Jain')) {
            throw new Error('Public team profiles are missing from CMS settings.');
          }
          if (!data.settings.pageContent || Object.keys(data.settings.pageContent).length < 11) {
            throw new Error('Page-by-page editable copy is missing from public settings.');
          }
          console.log('Public site OK:', data.settings.brandName, '| services:', data.services.length, '| portfolio items:', data.settings.portfolioItems.length, '| editable pages:', Object.keys(data.settings.pageContent).length);
          NODE
          curl --connect-timeout 8 --max-time 15 -fsS "$CMS_API_URL/public/blogs" >/tmp/cms-blogs.json
          node -e "const d=require('/tmp/cms-blogs.json'); if(!Array.isArray(d.posts)) process.exit(1); console.log('Public blog API OK:',d.posts.length,'published posts')"
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/admin/index.html" >/tmp/cms-admin.html
          grep -q 'Studio Admin' /tmp/cms-admin.html
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/blog/index.html" >/tmp/cms-blog.html
          grep -q 'Latest thinking' /tmp/cms-blog.html
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/cms-client.js" >/dev/null
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/growth-lab/" >/tmp/cms-growth-lab.html
          grep -q "window.location.replace('/services/paid-media/')" /tmp/cms-growth-lab.html
          if grep -q 'forgeForm\|data-concept-canvas\|Campaign Forge' /tmp/cms-growth-lab.html; then echo "Retired Campaign Forge route must redirect."; exit 1; fi
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/motion-system.css" >/dev/null
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/motion-system.js" >/dev/null
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/visitor-analytics.js" >/tmp/cms-visitor-analytics.js
          node --check /tmp/cms-visitor-analytics.js
          if grep -qi 'free growth plan' /tmp/cms-visitor-analytics.js; then echo "Non-paid/free-plan CTA copy must not ship."; exit 1; fi
          grep -Fq 'Discuss your project' /tmp/cms-visitor-analytics.js
          grep -Fq "I%27d%20like%20to%20discuss%20a%20project" /tmp/cms-visitor-analytics.js
          if grep -Eqi 'free[+%20_-]+growth[+%20_-]+plan|free growth plan' /tmp/cms-visitor-analytics.js; then echo "Non-paid/free-plan CTA copy must not ship."; exit 1; fi
          if grep -Eqi 'free-plan conversion form opens|free growth plan|I want a free growth plan' rti-growth-studio/admin/admin.js; then echo "Outdated admin conversion copy still present."; exit 1; fi
          grep -q 'name="meta_consent"' rti-growth-studio/index.html
          grep -q 'Send project enquiry' rti-growth-studio/index.html
          grep -q 'Send project enquiry' rti-growth-studio/contact/index.html
          grep -q 'name="meta_consent"' rti-growth-studio/contact/index.html
          echo "Conversion copy, homepage opt-in and project enquiry labels OK."
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/conversion-system.css" >/tmp/cms-conversion-system.css
          grep -q 'max-width:560px' /tmp/cms-conversion-system.css
          grep -q 'Mobile-first finish' rti-growth-studio/assets/aa-studio.css
          grep -q 'Mobile touch layouts' rti-growth-studio/admin/admin.css
          grep -q 'Site-wide conversion and responsive recovery' rti-growth-studio/assets/conversion-system.css
          grep -Fq 'function normalizeContactPhone' rti-growth-studio/assets/visitor-analytics.js
          grep -Fq 'Continue on WhatsApp' rti-growth-studio/assets/visitor-analytics.js
          grep -Fq "visitorScript.src='/assets/visitor-analytics.js?v=20261027-final1'" rti-growth-studio/assets/motion-system.js
          grep -Fq "var ANALYTICS_API=API_BASE+'/public/analytics/collect'" /tmp/cms-visitor-analytics.js
          grep -Fq "fetch(ANALYTICS_API" /tmp/cms-visitor-analytics.js
          grep -Fq "fetch(API_BASE+'/public/enquiries'" /tmp/cms-visitor-analytics.js
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/assets/conversion-system.css" >/dev/null
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/play/" >/tmp/cms-play.html
          grep -q "window.location.replace('/')" /tmp/cms-play.html
          if grep -q 'neonCanvas\|startGame\|NEON RUSH' /tmp/cms-play.html; then echo "Retired Arcade route must redirect."; exit 1; fi

          for page in "/" "contact/" "blog/" "services/" "work/" "studio/" "team/" "privacy.html" "terms.html" "admin/"; do
            curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/$page" >/tmp/motion-page.html
            grep -q "motion-system.css" /tmp/motion-page.html || { echo "Motion stylesheet not wired on $page"; exit 1; }
            grep -q "motion-system.js" /tmp/motion-page.html || { echo "Motion script not wired on $page"; exit 1; }
          done
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/admin/admin.js" >/tmp/cms-admin.js
          grep -q 'Growth insights' /tmp/cms-admin.html
          grep -q 'data-view="visitors"' /tmp/cms-admin.html
          grep -q 'data-view="marketing"' /tmp/cms-admin.html
          grep -q 'loadMarketing' /tmp/cms-admin.js
          grep -q 'metaSettingsForm' /tmp/cms-admin.js
          grep -q 'loadVisitors' /tmp/cms-admin.js
          grep -q 'exportEnquiriesCsv' /tmp/cms-admin.js
          for page in "services/" "work/" "studio/" "team/" "contact/" "services/social-media/" "services/video-motion/" "services/brand-design/" "services/websites/" "services/app-uiux/" "services/paid-media/"; do
            curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/$page" >/tmp/cms-page.html
            grep -q 'src="/assets/cms-client.js"' /tmp/cms-page.html || { echo "CMS client script missing on $page"; exit 1; }
          done
          curl --connect-timeout 8 --max-time 15 -fsS "$SITE_URL/team/" >/tmp/cms-team.html
          grep -q 'Apurba Ruidas' /tmp/cms-team.html
          grep -q 'Divyanshu Bhargava' /tmp/cms-team.html
          grep -q 'Arya Rupesh Jain' /tmp/cms-team.html
          grep -q 'assets/team/apurba-ruidas.webp' /tmp/cms-team.html
          echo "Team page verified: founder plus real team profiles and portraits are published."
          echo "Homepage, admin, blog, all 11 editable sub-pages and CMS assets are reachable."

      - name: Check browser cross-origin connection
        env:
          CMS_API_URL: https://aa-growth-studio-cms-api.onrender.com/api
          SITE_ORIGIN: https://rti-growth-studio.onrender.com
        run: |
          set -euo pipefail
          for attempt in $(seq 1 8); do
            if curl --connect-timeout 8 --max-time 20 --retry 2 --retry-all-errors --retry-delay 3 -sS -D /tmp/cms-cors-headers -o /dev/null -X OPTIONS "$CMS_API_URL/admin/login" -H "Origin: $SITE_ORIGIN" -H 'Access-Control-Request-Method: POST' -H 'Access-Control-Request-Headers: content-type'; then
              if grep -qi "access-control-allow-origin: $SITE_ORIGIN" /tmp/cms-cors-headers; then
                break
              fi
            fi
            if [ "$attempt" -eq 8 ]; then
              echo "CMS CORS preflight did not recover after retries."
              cat /tmp/cms-cors-headers || true
              exit 1
            fi
            echo "Waiting for API rollout before CORS check ($attempt/8)..."
            sleep 5
          done
          grep -qi "access-control-allow-origin: $SITE_ORIGIN" /tmp/cms-cors-headers
          echo "CORS preflight OK for the public website origin."
