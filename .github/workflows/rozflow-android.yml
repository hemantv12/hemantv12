name: RozFlow Android APK
on:
  pull_request:
    branches: [subsathi-launch]
    paths:
      - "rozflow/mobile/**"
      - ".github/workflows/rozflow-android.yml"
  push:
    branches: [subsathi-launch]
    paths:
      - "rozflow/mobile/**"
      - ".github/workflows/rozflow-android.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rozflow-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-apk:
    name: Type-check and build RozFlow APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rozflow/mobile
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "Could not locate sdkmanager"; exit 1; fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleRelease --stacktrace --console=plain --max-workers=2
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then echo "APK not generated"; exit 1; fi
          if ! unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle$'; then
            echo "APK missing embedded JavaScript bundle"
            exit 1
          fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RozFlow-Android-APK
          path: rozflow/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
