name: EarnRoute cloud build

on:
  workflow_dispatch:
  push:
    branches: [earnroute-production]
    paths:
      - '.earnroute-payload-v2/READY'

permissions:
  contents: write

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Restore source bundle
        shell: bash
        run: |
          mkdir -p /tmp/earnroute-source
          cat .earnroute-payload-v2/part-*.b64 | base64 --decode > /tmp/earnroute-source.tar.gz
          tar -xzf /tmp/earnroute-source.tar.gz -C /tmp/earnroute-source
          test -f /tmp/earnroute-source/EarnRoute/app/main.py
          rm -rf EarnRoute
          mkdir -p EarnRoute
          cp -a /tmp/earnroute-source/EarnRoute/. EarnRoute/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend tests and checks
        working-directory: EarnRoute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q app tests scripts
          node --check app/static/app.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Sync frontend into Android assets
        working-directory: EarnRoute/android
        run: ./sync-assets.sh

      - name: Build installable debug APK
        working-directory: EarnRoute/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-debug-apk
          path: EarnRoute/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Commit extracted source directory
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Add extracted EarnRoute application source'
          file_pattern: 'EarnRoute/**'
          branch: earnroute-production
