name: EarnRoute cloud build

on:
  workflow_dispatch:
  push:
    branches: [earnroute-production]
    paths:
      - 'EarnRoute/**'
      - '.github/workflows/earnroute-cloud-build.yml'

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify checked-in application source
        run: |
          test -f EarnRoute/app/main.py
          test -f EarnRoute/deployment/backup_postgres.py
          test -f EarnRoute/OWNER-SETUP-44.md
          test -f EarnRoute/app/static/nearby.js
          test -f EarnRoute/android/app/src/main/java/in/earnroute/app/MainActivity.java
          grep -q 'id="er-app-welcome"' EarnRoute/app/static/index.html
          grep -q 'classList.add("er-native-app")' EarnRoute/app/static/index.html
          grep -q 'NATIVE-FIRST APP SHELL' EarnRoute/app/static/nearby.css
          grep -q 'MOBILE FIT AND WRAPPING FIXES' EarnRoute/app/static/nearby.css
          grep -q 'EXPANDABLE RADIUS SELECTOR LAYOUT' EarnRoute/app/static/nearby.css
          grep -Fq 'const ER_RADIUS_OPTIONS = [1, 3, 5, 8, 10, 15]' EarnRoute/app/static/nearby.js
          grep -q 'google.com/maps/search' EarnRoute/app/static/nearby.js
          grep -q 'data-share-nearby-job' EarnRoute/app/static/nearby.js
          grep -q 'FULL-SCREEN HINDI LOCALIZATION' EarnRoute/app/static/app.js
          grep -Fq "document.querySelectorAll('[data-er-language-toggle]')" EarnRoute/app/static/app.js
          grep -q 'shareText(String text, String chooserTitle)' EarnRoute/android/app/src/main/java/in/earnroute/app/MainActivity.java
          grep -q 'test_worker_profile_accepts_more_radius_presets' EarnRoute/tests/test_core.py
          grep -q "versionName '1.4.0'" EarnRoute/android/app/build.gradle

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync frontend into Android assets
        working-directory: EarnRoute/android
        run: ./sync-assets.sh

      - name: Run tests and source checks
        working-directory: EarnRoute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q app tests scripts
          python -m py_compile deployment/backup_postgres.py
          node --check app/static/app.js
          node --check app/static/nearby.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build installable debug APK
        working-directory: EarnRoute/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-nearby-debug-apk
          path: EarnRoute/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
