name: EarnRoute cloud build

on:
  workflow_dispatch:
  push:
    branches: [earnroute-production]
    paths:
      - 'EarnRoute/**'
      - '.github/workflows/earnroute-cloud-build.yml'

permissions:
  contents: read

jobs:
  verify-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify checked-in application source
        run: test -f EarnRoute/app/main.py && test -f EarnRoute/app/static/nearby.js && test -f EarnRoute/android/app/src/main/java/in/earnroute/app/MainActivity.java

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync frontend into Android assets
        working-directory: EarnRoute/android
        run: ./sync-assets.sh

      - name: Run tests and source checks
        working-directory: EarnRoute
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest -q
          python -m compileall -q app tests scripts
          node --check app/static/app.js
          node --check app/static/nearby.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Build installable debug APK
        working-directory: EarnRoute/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-nearby-debug-apk
          path: EarnRoute/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
