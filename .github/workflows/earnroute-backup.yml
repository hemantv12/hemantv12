name: EarnRoute encrypted PostgreSQL backup

on:
  schedule:
    # 20:30 UTC = 02:00 Asia/Kolkata on the following calendar day.
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnroute-encrypted-database-backup
  cancel-in-progress: false

jobs:
  encrypted-database-backup:
    name: Dump, encrypt, upload and verify PostgreSQL backup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.EARNROUTE_DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.NEON_STORAGE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.NEON_STORAGE_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL_S3: https://br-snowy-paper-b3u8r564.storage.c-4.ap-southeast-1.aws.neon.tech
      AWS_REGION: ap-southeast-1
      BACKUP_BUCKET: earnroute-backups
      BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.EARNROUTE_BACKUP_PASSPHRASE }}
      BACKUP_RETENTION_DAYS: "14"
    steps:
      - name: Checkout EarnRoute production source
        uses: actions/checkout@v4
        with:
          ref: earnroute-production

      - name: Validate required owner-managed secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in DATABASE_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY BACKUP_ENCRYPTION_PASSPHRASE; do
            if [ -z "${!key:-}" ]; then
              echo "::error::Missing Actions secret for ${key}. See EarnRoute/OWNER-SETUP-44.md, section 'Daily encrypted backup'."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          if [ "${#BACKUP_ENCRYPTION_PASSPHRASE}" -lt 32 ]; then
            echo "::error::EARNROUTE_BACKUP_PASSPHRASE must have at least 32 characters."
            exit 1
          fi

      - name: Build isolated backup image
        run: docker build --pull --file EarnRoute/deployment/Backup.Dockerfile --tag earnroute-backup:ci .

      - name: Create, encrypt, upload, download and verify backup
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DATABASE_URL \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e AWS_ENDPOINT_URL_S3 \
            -e AWS_REGION \
            -e BACKUP_BUCKET \
            -e BACKUP_ENCRYPTION_PASSPHRASE \
            -e BACKUP_RETENTION_DAYS \
            earnroute-backup:ci
