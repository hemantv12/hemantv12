name: EarnRoute APK delivery

on:
  push:
    branches:
      - earnroute-production
    paths:
      - '.github/workflows/earnroute-apk-delivery.yml'
      - 'EarnRoute/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: earnroute-apk-delivery
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test backend and build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out EarnRoute source
        uses: actions/checkout@v4
        with:
          ref: earnroute-production

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: EarnRoute/requirements.txt

      - name: Install backend dependencies
        working-directory: EarnRoute
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run automated backend and packaging tests
        working-directory: EarnRoute
        run: pytest -q

      - name: Compile Python source
        working-directory: EarnRoute
        run: python -m compileall -q app tests scripts

      - name: Check frontend JavaScript syntax
        working-directory: EarnRoute
        run: node --check app/static/app.js

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'

      - name: Bundle the latest frontend into the Android app
        working-directory: EarnRoute/android
        run: |
          chmod +x ./sync-assets.sh
          ./sync-assets.sh

      - name: Build installable debug APK
        working-directory: EarnRoute/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK='EarnRoute/android/app/build/outputs/apk/debug/app-debug.apk'
          test -s "$APK"
          echo "APK size:"
          du -h "$APK"
          echo "SHA-256:"
          sha256sum "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarnRoute-debug-apk
          path: EarnRoute/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
