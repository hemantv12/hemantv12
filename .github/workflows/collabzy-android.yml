name: Build Collabzy Android APK
on:
  workflow_dispatch:
  push:
    branches: [collabzy-android]
    paths:
      - 'collabzy-app/**'
      - '.github/workflows/collabzy-android.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collabzy-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Configure API endpoint for APK
        run: |
          node -e "const fs=require('fs');const p='public/index.html';let s=fs.readFileSync(p,'utf8');s=s.replace(\"const API=(window.COLLABZY_API_BASE||((location.protocol==='capacitor:'||(location.hostname==='localhost'&&!location.port))?'https://collabzy-api.onrender.com/api':'/api')).replace(/\\\\/$/,'');\",\"const API=(window.COLLABZY_API_BASE||'https://collabzy-api.onrender.com/api').replace(/\\\\/$/,'');\");fs.writeFileSync(p,s);"
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Collabzy-Android-APK
          path: collabzy-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
