name: Build Collabzy Android APK
on:
  workflow_dispatch:
  push:
    branches: [collabzy-android]
    paths:
      - 'collabzy-app/**'
      - '.github/workflows/collabzy-android.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collabzy_test
          POSTGRES_PASSWORD: collabzy_test_password
          POSTGRES_DB: collabzy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabzy_test -d collabzy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: collabzy-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test backend API
        run: npm test
      - name: Test PostgreSQL production backend
        env:
          DATABASE_URL: postgresql://collabzy_test:collabzy_test_password@localhost:5432/collabzy_test
          PGSSLMODE: disable
        run: npm run test:postgres
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Collabzy-Android-APK
          path: collabzy-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
