name: Build Collabzy Android APK
on:
  workflow_dispatch:
  push:
    branches: [collabzy-android]
    paths:
      - 'collabzy-app/**'
      - '.github/workflows/collabzy-android.yml'
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: collabzy_test
          POSTGRES_PASSWORD: collabzy_test_password
          POSTGRES_DB: collabzy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U collabzy_test -d collabzy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: collabzy-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test backend API
        run: npm test
      - name: Test PostgreSQL production backend
        env:
          DATABASE_URL: postgresql://collabzy_test:collabzy_test_password@localhost:5432/collabzy_test
          PGSSLMODE: disable
        run: npm run test:postgres
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Configure native OAuth deep link
        run: node scripts/configure-android.js
      - name: Install native Collabzy Android screens
        run: |
          test -f native-android/MainActivity.java
          mkdir -p android/app/src/main/java/com/collabzy/creator
          cp native-android/MainActivity.java android/app/src/main/java/com/collabzy/creator/MainActivity.java
      - name: Add native HTTP client dependency
        run: |
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' android/app/build.gradle || sed -i '/dependencies {/a\    implementation "com.squareup.okhttp3:okhttp:4.12.0"' android/app/build.gradle
      - name: Apply Collabzy Android launcher branding
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cat > android/app/src/main/res/values/collabzy_launcher_colors.xml <<'EOF'
          <resources>
            <color name="collabzy_launcher_background">#201633</color>
          </resources>
          EOF
          cat > android/app/src/main/res/drawable/collabzy_launcher_foreground.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#00000000" android:strokeColor="#73EAD4"
                android:strokeWidth="8" android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M46,31 L39,31 C26,31 18,41 18,54 C18,67 27,77 40,77 L46,77" />
            <path android:fillColor="#00000000" android:strokeColor="#FFFFFF"
                android:strokeWidth="8" android:strokeLineCap="round" android:strokeLineJoin="round"
                android:pathData="M62,31 L69,31 C82,31 90,41 90,54 C90,67 81,77 68,77 L62,77" />
            <path android:fillColor="#73EAD4" android:pathData="M35,50 L73,50 L73,58 L35,58 Z" />
          </vector>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/collabzy_launcher_background" />
            <foreground android:drawable="@drawable/collabzy_launcher_foreground" />
          </adaptive-icon>
          EOF
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/collabzy_launcher_background" />
            <foreground android:drawable="@drawable/collabzy_launcher_foreground" />
          </adaptive-icon>
          EOF
      - name: Configure Android startup instrumentation test
        run: |
          sed -i '/defaultConfig {/a\\        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"' android/app/build.gradle
          cat >> android/app/build.gradle <<'EOF'

          dependencies {
              androidTestImplementation "androidx.test:runner:1.6.2"
              androidTestImplementation "androidx.test:core:1.6.1"
              androidTestImplementation "androidx.test.ext:junit:1.2.1"
              androidTestImplementation "junit:junit:4.13.2"
          }
          EOF
          mkdir -p android/app/src/androidTest/java/com/collabzy/creator
          cp native-android-tests/StartupScreenTest.java android/app/src/androidTest/java/com/collabzy/creator/StartupScreenTest.java
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - name: Verify native launcher in APK
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          found=false
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -Fq 'Lcom/collabzy/creator/MainActivity;'; then
              found=true
              break
            fi
          done < <(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex')
          test "$found" = true
          echo "Verified native MainActivity is compiled into the APK."
      - name: Launch Collabzy on Android 8.1 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 27
          target: default
          arch: x86
          profile: pixel_2
          disable-animations: true
          script: cd collabzy-app/android && ./gradlew connectedDebugAndroidTest --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Collabzy-Android-APK
          path: collabzy-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
