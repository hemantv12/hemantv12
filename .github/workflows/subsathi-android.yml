name: Build SubSathi standalone Android test APK

on:
  push:
    branches:
      - subsathi-launch
    paths:
      - 'subsathi-fullstack/mobile/**'
      - '.github/workflows/subsathi-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build standalone Android test APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subsathi-fullstack/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Could not locate sdkmanager under $SDK_ROOT"
            exit 1
          fi
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund
      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Build standalone release APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "Release APK was not generated: $APK"
            exit 1
          fi
          if ! unzip -l "$APK" | grep -qE 'assets/index\.android\.bundle$'; then
            echo "The APK does not contain the bundled React Native JavaScript; refusing to upload a broken APK."
            unzip -l "$APK" | grep -E 'assets/.*bundle' || true
            exit 1
          fi
          echo "Standalone APK contains its JavaScript bundle."
      - name: Upload standalone test APK
        uses: actions/upload-artifact@v4
        with:
          name: SubSathi-Standalone-Android-Test-APK
          path: subsathi-fullstack/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
