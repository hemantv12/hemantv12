name: Build Gavyuh Android APK

on:
  push:
    paths:
      - '.gavyuh_source/**'
      - '.github/workflows/build-gavyuh-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct app source bundle
        shell: bash
        run: |
          cat .gavyuh_source/part-01.b64 .gavyuh_source/part-02.b64 > /tmp/gavyuh-source.b64
          head -c 4500 .gavyuh_source/part-03.b64 >> /tmp/gavyuh-source.b64
          cat .gavyuh_source/part-04.b64 .gavyuh_source/part-05.b64 >> /tmp/gavyuh-source.b64
          base64 --decode /tmp/gavyuh-source.b64 > /tmp/gavyuh-source.zip
          unzip -t /tmp/gavyuh-source.zip
          mkdir -p gavyuh-app
          unzip -oq /tmp/gavyuh-source.zip -d /tmp/gavyuh-unpacked
          cp -R /tmp/gavyuh-unpacked/gavyuh-app/. gavyuh-app/

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffold
        working-directory: gavyuh-app
        run: flutter create --platforms=android --org com.gavyuh.dairy --project-name gavyuh_dairy build_app

      - name: Install app sources
        working-directory: gavyuh-app
        run: |
          cp pubspec.yaml build_app/pubspec.yaml
          cp -R lib build_app/lib
          cp -R test build_app/test
          sed -i 's/android:label="gavyuh_dairy"/android:label="Gavyuh Dairy Farm"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Resolve dependencies
        working-directory: gavyuh-app/build_app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: gavyuh-app/build_app
        run: flutter test

      - name: Build release APK
        working-directory: gavyuh-app/build_app
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gavyuh-android-apk
          path: gavyuh-app/build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14