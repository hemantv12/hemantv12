name: EarnRoute live API smoke check

on:
  workflow_dispatch:
  push:
    branches: [earnroute-production]
    paths:
      - '.github/workflows/earnroute-api-smoke.yml'
      - 'EarnRoute/app/main.py'
      - 'EarnRoute/app/static/nearby.js'
      - 'EarnRoute/app/static/nearby.css'

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check live HTTPS API and PostgreSQL health
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors https://earnroute-nearby-api.onrender.com/api/health)"
          echo "$BODY"
          python -c 'import json,sys; result=json.loads(sys.argv[1]); assert result.get("status") == "ok", result; print("EarnRoute API and database health check: PASS")' "$BODY"

      - name: Verify strict nearby radius and distance response
        shell: bash
        run: |
          set -euo pipefail
          NEARBY="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors 'https://earnroute-nearby-api.onrender.com/api/jobs?latitude=28.6139&longitude=77.2090&radius_km=1&page_size=10')"
          echo "$NEARBY"
          python -c 'import json,sys; r=json.loads(sys.argv[1]); assert r.get("nearby") is True, r; assert r.get("radius_km") == 1, r; items=r.get("items", []); assert all(x.get("distance_km") is not None and x["distance_km"] <= 1 for x in items), r; assert all(items[i]["distance_km"] <= items[i+1]["distance_km"] for i in range(len(items)-1)), r; print("Nearby radius, exact distance and sorting check: PASS")' "$NEARBY"

      - name: Verify expanded More radius is supported by live API
        shell: bash
        run: |
          set -euo pipefail
          MORE=$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors 'https://earnroute-nearby-api.onrender.com/api/jobs?latitude=28.6139&longitude=77.2090&radius_km=15&page_size=10')
          echo "$MORE"
          python -c 'import json,sys; r=json.loads(sys.argv[1]); assert r.get("nearby") is True, r; assert r.get("radius_km") == 15, r; assert all(x.get("distance_km") is not None and x["distance_km"] <= 15 for x in r.get("items", [])), r; print("More radius 15 km API check: PASS")' "$MORE"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' 'https://earnroute-nearby-api.onrender.com/api/jobs?latitude=28.6139&longitude=77.2090&radius_km=20&page_size=10')
          test "$code" = "422"
          echo "Unsupported 20 km radius rejection: PASS"

      - name: Verify privacy-safer POST nearby search
        shell: bash
        run: |
          set -euo pipefail
          POST_NEARBY="$(curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            -H 'Content-Type: application/json' \
            -X POST 'https://earnroute-nearby-api.onrender.com/api/jobs/nearby' \
            --data '{"latitude":28.6139,"longitude":77.2090,"radius_km":1,"page":1,"page_size":10}')"
          echo "$POST_NEARBY"
          python -c 'import json,sys; r=json.loads(sys.argv[1]); assert r.get("nearby") is True, r; assert r.get("radius_km") == 1, r; items=r.get("items", []); assert all(x.get("distance_km") is not None and x["distance_km"] <= 1 for x in items), r; assert all(items[i]["distance_km"] <= items[i+1]["distance_km"] for i in range(len(items)-1)), r; print("POST nearby search, distance and sorting check: PASS")' "$POST_NEARBY"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' -X POST \
            'https://earnroute-nearby-api.onrender.com/api/jobs/nearby' \
            --data '{"latitude":28.6139,"radius_km":1}')
          test "$code" = "422"
          echo "Invalid partial-coordinate rejection: PASS"
