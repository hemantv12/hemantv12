<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><radialGradient id="glow"><stop offset="0" stop-color="#D7F36B" stop-opacity=".15"/><stop offset="1" stop-color="#D7F36B" stop-opacity="0"/></radialGradient></defs><rect x="0" y="0" width="1080" height="1350" rx="0" fill="#141713"/><circle cx="1010" cy="270" r="240" fill="#242b1d"/><circle cx="30" cy="1120" r="260" fill="#20271c"/><circle cx="980" cy="270" r="220" fill="url(#glow)"/><image x="56" y="42" width="104" height="104" preserveAspectRatio="xMidYMid meet" href="data:image/jpeg;base64,"/><text x="176" y="82" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">AA GROWTH</text><text x="176" y="111" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">STUDIO</text><text x="1022" y="76" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" fill="#AEB4A3" text-anchor="end" letter-spacing="2">BRAND / FLEXIBILITY</text><text x="1022" y="108" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="800" fill="#D7F36B" text-anchor="end" letter-spacing="0">5/5</text> <line x1="58" y1="152" x2="1022" y2="152" stroke="#3d4436" stroke-width="2" stroke-linecap="round"/><text x="58" y="230" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="0">Repeat the rules,</text><text x="58" y="302" font-family="Arial,Helvetica,sans-serif" font-size="62" font-weight="800" fill="#D7F36B" text-anchor="start" letter-spacing="0">not the exact layout.</text><text x="58" y="382" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="500" fill="#AEB4A3" text-anchor="start" letter-spacing="0">Build recognition through a few deliberate patterns:</text><circle cx="96" cy="486" r="22" fill="#D7F36B"/><text x="96" y="494" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#10130f" text-anchor="middle" letter-spacing="0">1</text><text x="144" y="482" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">COLOUR ROLES</text><text x="144" y="526" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#AEB4A3" text-anchor="start" letter-spacing="0">Use accent colour to guide attention—not decorate everything.</text><circle cx="96" cy="656" r="22" fill="#FF674D"/><text x="96" y="664" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#10130f" text-anchor="middle" letter-spacing="0">2</text><text x="144" y="652" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">TYPE SCALE</text><text x="144" y="696" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#AEB4A3" text-anchor="start" letter-spacing="0">Make the headline, support and action feel related.</text><circle cx="96" cy="826" r="22" fill="#F4F0E7"/><text x="96" y="834" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#10130f" text-anchor="middle" letter-spacing="0">3</text><text x="144" y="822" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">SHAPE LANGUAGE</text><text x="144" y="866" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#AEB4A3" text-anchor="start" letter-spacing="0">Repeat a small set of forms, borders and spacing rules.</text><circle cx="96" cy="996" r="22" fill="#D7F36B"/><text x="96" y="1004" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#10130f" text-anchor="middle" letter-spacing="0">4</text><text x="144" y="992" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" fill="#F4F0E7" text-anchor="start" letter-spacing="1">MESSAGE TONE</text><text x="144" y="1036" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="500" fill="#AEB4A3" text-anchor="start" letter-spacing="0">Sound like the same brand in every channel.</text><rect x="58" y="1150" width="964" height="84" rx="18" fill="#2a3024" stroke="#5b6847" stroke-width="2"/><text x="88" y="1204" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#D7F36B" text-anchor="start" letter-spacing="0">A system makes new creative easier to recognise—and easier to build.</text><line x1="58" y1="1268" x2="1022" y2="1268" stroke="#41483a" stroke-width="2" stroke-linecap="round"/><text x="58" y="1310" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#AEB4A3" text-anchor="start" letter-spacing="1">AA GROWTH STUDIO  /  SWIPE TO CONTINUE</text><text x="1022" y="1310" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" fill="#D7F36B" text-anchor="end" letter-spacing="0">5  →</text></svg>