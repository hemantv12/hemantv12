<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26301D"/><stop offset=".55" stop-color="#11150F"/><stop offset="1" stop-color="#080A08"/></linearGradient><radialGradient id="glow"><stop offset="0" stop-color="#D7F36B" stop-opacity=".16"/><stop offset="1" stop-color="#D7F36B" stop-opacity="0"/></radialGradient><pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#FFFFFF" stroke-opacity=".035" stroke-width="1"/></pattern></defs><rect width="1080" height="1350" fill="url(#g)"/><rect width="1080" height="1350" fill="url(#grid)"/><circle cx="950" cy="300" r="360" fill="url(#glow)"/><circle cx="80" cy="1080" r="280" fill="url(#glow)"/><image x="56" y="42" width="104" height="104" href="data:image/jpeg;base64," preserveAspectRatio="xMidYMid meet"/><text x="174" y="82" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="800" letter-spacing="1">AA GROWTH</text><text x="174" y="116" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800" letter-spacing="2">STUDIO</text><text x="744" y="82" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" letter-spacing="2">CREATIVE &amp; VIDEO</text><text x="932" y="125" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1">03 / 05</text><path d="M56 164 H1024" stroke="#48503D" stroke-width="2"/><text x="70" y="255" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" letter-spacing="0">Choose one movement</text><text x="70" y="320" fill="#D7F36B" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="800" letter-spacing="0">language.</text><text x="72" y="390" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="500" letter-spacing="0">Transitions should support the story, not compete with it.</text><rect x="70" y="500" width="285" height="450" rx="22" fill="#22291D" stroke="#48503D" stroke-width="2"/><circle cx="106" cy="540" r="16" fill="#D7F36B"/><text x="101" y="547" fill="#0B0E0B" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="0">01</text><text x="96" y="600" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="0">SLIDE</text><text x="96" y="643" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">A directional move</text><text x="96" y="674" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">that guides the eye.</text><text x="96" y="705" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0"></text><text x="96" y="736" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">Useful for a clear</text><text x="96" y="767" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">sequence or reveal.</text><path d="M130 840 H290 M265 815 L290 840 L265 865" stroke="#D7F36B" stroke-width="12" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="397" y="500" width="285" height="450" rx="22" fill="#22291D" stroke="#48503D" stroke-width="2"/><circle cx="433" cy="540" r="16" fill="#FF674D"/><text x="428" y="547" fill="#0B0E0B" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="0">02</text><text x="423" y="600" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="0">MASK</text><text x="423" y="643" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">Reveal a detail</text><text x="423" y="674" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">with intention.</text><text x="423" y="705" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0"></text><text x="423" y="736" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">Useful for showing</text><text x="423" y="767" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">what matters.</text><rect x="460" y="820" width="150" height="58" rx="12" fill="none" stroke="#FF674D" stroke-width="8"/><path d="M535 820 V878" stroke="#FF674D" stroke-width="8"/><rect x="724" y="500" width="285" height="450" rx="22" fill="#22291D" stroke="#48503D" stroke-width="2"/><circle cx="760" cy="540" r="16" fill="#D7F36B"/><text x="755" y="547" fill="#0B0E0B" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="0">03</text><text x="750" y="600" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="800" letter-spacing="0">SCALE</text><text x="750" y="643" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">Create emphasis</text><text x="750" y="674" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">without noise.</text><text x="750" y="705" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0"></text><text x="750" y="736" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">Useful for a single</text><text x="750" y="767" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="500" letter-spacing="0">key moment.</text><circle cx="866" cy="850" r="54" fill="none" stroke="#D7F36B" stroke-width="10"/><circle cx="866" cy="850" r="22" fill="#D7F36B"/><path d="M56 1220 H1024" stroke="#48503D" stroke-width="2"/><text x="58" y="1270" fill="#A8AE9E" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2">AA GROWTH STUDIO</text><text x="395" y="1270" fill="#F2EEE6" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="1">AAGROWTHSTUDIO.COM</text><text x="952" y="1270" fill="#D7F36B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="1">3/5</text></svg>