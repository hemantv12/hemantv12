  <circle r="104" fill="#FFF8E8" stroke="#FF674D" stroke-width="6"/>
  <text x="0" y="-10" text-anchor="middle" fill="#17232D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1">REAL LOCAL</text>
  <text x="0" y="25" text-anchor="middle" fill="#17232D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1">VALUE</text>
</g>
<g fill="#FFF8E8" font-family="Arial,Helvetica,sans-serif">
  <text x="82" y="535" fill="#D7F36B" font-size="21" font-weight="900" letter-spacing="2">01 / SERVICE</text>
  <text x="82" y="578" font-size="27" font-weight="700">What job can someone</text><text x="82" y="614" font-size="27" font-weight="700">actually request?</text>
  <text x="655" y="535" fill="#D7F36B" font-size="21" font-weight="900" letter-spacing="2">02 / COVERAGE</text>
  <text x="655" y="578" font-size="27" font-weight="700">Do you genuinely serve</text><text x="655" y="614" font-size="27" font-weight="700">this area?</text>
  <text x="82" y="1080" fill="#FF674D" font-size="21" font-weight="900" letter-spacing="2">03 / LOCAL DETAIL</text>
  <text x="82" y="1123" font-size="27" font-weight="700">What useful detail</text><text x="82" y="1159" font-size="27" font-weight="700">actually changes here?</text>
  <text x="655" y="1080" fill="#FF674D" font-size="21" font-weight="900" letter-spacing="2">04 / NEXT STEP</text>
  <text x="655" y="1123" font-size="27" font-weight="700">How does a request</text><text x="655" y="1159" font-size="27" font-weight="700">move forward?</text>
</g>
<text x="80" y="1275" fill="#FFF8E8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" letter-spacing="2">03 / 05</text>
