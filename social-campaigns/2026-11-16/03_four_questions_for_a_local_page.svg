<text x="76" y="244" fill="#FFF8E8" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="900" letter-spacing="-2">A LOCAL PAGE</text>
<text x="76" y="326" fill="#FFF8E8" font-family="Arial,Helvetica,sans-serif" font-size="67" font-weight="900" letter-spacing="-2">HAS TO ANSWER</text>
<text x="76" y="408" fill="#FF674D" font-family="Georgia,serif" font-size="86" font-style="italic">four questions.</text>
