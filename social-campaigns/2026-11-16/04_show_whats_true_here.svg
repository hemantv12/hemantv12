<g font-family="Arial,Helvetica,sans-serif">
  <text x="84" y="500" fill="#FF674D" font-size="42" font-weight="900">01</text>
  <text x="174" y="490" fill="#17232D" font-size="24" font-weight="900" letter-spacing="1.5">REAL COVERAGE</text>
  <text x="174" y="529" fill="#394550" font-size="25">Only towns and ZIPs you actually serve.</text>
  <path d="M84 558H990" stroke="#17232D" stroke-width="1.5" opacity=".25"/>
  <text x="84" y="650" fill="#FF674D" font-size="42" font-weight="900">02</text>
  <text x="174" y="640" fill="#17232D" font-size="24" font-weight="900" letter-spacing="1.5">REAL WORK</text>
  <text x="174" y="679" fill="#394550" font-size="25">Jobs and property types your team handles.</text>
  <path d="M84 708H990" stroke="#17232D" stroke-width="1.5" opacity=".25"/>
  <text x="84" y="800" fill="#FF674D" font-size="42" font-weight="900">03</text>
  <text x="174" y="790" fill="#17232D" font-size="24" font-weight="900" letter-spacing="1.5">LOCAL CONTEXT</text>
  <text x="174" y="829" fill="#394550" font-size="25">Access, logistics or process details that truly vary.</text>
  <path d="M84 858H990" stroke="#17232D" stroke-width="1.5" opacity=".25"/>
  <text x="84" y="950" fill="#FF674D" font-size="42" font-weight="900">04</text>
  <text x="174" y="940" fill="#17232D" font-size="24" font-weight="900" letter-spacing="1.5">CLEAR ROUTE</text>
  <text x="174" y="979" fill="#394550" font-size="25">A direct way to request the right service.</text>
</g>
