<text x="76" y="1118" fill="#17232D" font-family="Georgia,serif" font-size="29" font-style="italic">No invented crews, addresses, projects or reviews.</text>
<text x="76" y="1260" fill="#17232D" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" letter-spacing="2">USE ONLY DETAILS YOU CAN STAND BEHIND</text>
