<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">A Blank Screen Still Has a Job — AA Growth Studio</title>
<desc id="desc">A neo-brutalist editorial poster for SaaS product teams. A giant outlined zero represents an empty state. The message distinguishes first-use, no-results, completed and error states, each with a different next step.</desc>
<rect width="1080" height="1350" fill="#E9E4F0"/>
<rect width="18" height="1350" fill="#2B2038"/>
<path d="M72 132H1008" stroke="#2B2038" stroke-width="2" opacity=".32"/>
<text x="72" y="100" fill="#594C67" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="4">PRODUCT UX / ZERO-STATE NOTES</text>
<text x="1008" y="100" text-anchor="end" fill="#594C67" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="3">01 — SAAS</text>
<!-- The open zero is an editorial metaphor, not a product screenshot. -->
<text x="540" y="655" text-anchor="middle" fill="none" stroke="#B8AACB" stroke-width="9" font-family="Georgia,serif" font-size="600" font-weight="400">0</text>
<path d="M540 405V530" stroke="#FF674D" stroke-width="8" stroke-linecap="square"/>
<path d="M512 502L540 532L568 502" fill="none" stroke="#FF674D" stroke-width="8" stroke-linecap="square" stroke-linejoin="miter"/>
<text x="540" y="590" text-anchor="middle" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" letter-spacing="5">NO DATA YET</text>
<text x="72" y="812" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="91" font-weight="900" letter-spacing="-5">A BLANK SCREEN</text>
<text x="72" y="908" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="91" font-weight="900" letter-spacing="-5">STILL HAS A JOB.</text>
<text x="76" y="974" fill="#51465F" font-family="Georgia,serif" font-size="29" font-style="italic">Different empty states need different next steps.</text>
<path d="M72 1018H1008" stroke="#2B2038" stroke-width="2"/>
<!-- Open editorial rows, not UI cards. -->
<text x="76" y="1080" fill="#8A6DA7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">01 / FIRST USE</text>
<text x="76" y="1115" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Show what belongs here.</text>
<path d="M540 1040V1132" stroke="#2B2038" stroke-width="1" opacity=".28"/>
<text x="584" y="1080" fill="#8A6DA7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">02 / NO RESULTS</text>
<text x="584" y="1115" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700">Make the reset obvious.</text>
<path d="M72 1150H1008" stroke="#2B2038" stroke-width="1" opacity=".28"/>
<text x="76" y="1190" fill="#8A6DA7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">03 / COMPLETED</text>
<text x="76" y="1223" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Acknowledge the progress.</text>
<path d="M540 1164V1234" stroke="#2B2038" stroke-width="1" opacity=".28"/>
<text x="584" y="1190" fill="#8A6DA7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">04 / ERROR</text>
<text x="584" y="1223" fill="#2B2038" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">Explain. Then recover.</text>
