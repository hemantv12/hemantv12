<text x="185" y="762" fill="#F1EEE6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">What do they do today?</text>
<path d="M185 796H1000" stroke="#F1EEE6" stroke-opacity=".18" stroke-width="2"/>
<text x="78" y="900" fill="#D7F36B" font-family="Georgia,serif" font-size="57" font-weight="700">03</text>
<text x="185" y="892" fill="#F1EEE6" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">Where does it slow down?</text>
