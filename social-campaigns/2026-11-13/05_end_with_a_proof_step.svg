<text x="72" y="680" fill="#20241F" font-family="Georgia,serif" font-size="37" font-weight="700">Agree on four things:</text>
<g fill="none" stroke="#20241F" stroke-width="4">
 <path d="M82 742L110 770L160 712"/><path d="M82 850L110 878L160 820"/><path d="M82 958L110 986L160 928"/><path d="M82 1066L110 1094L160 1036"/>
