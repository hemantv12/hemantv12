<text x="198" y="764" fill="#20241F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">ONE REAL TASK</text>
<text x="198" y="872" fill="#20241F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">ONE OWNER</text>
<text x="198" y="980" fill="#20241F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">ONE DATE</text>
<text x="198" y="1088" fill="#20241F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="900">ONE SUCCESS SIGNAL</text>
