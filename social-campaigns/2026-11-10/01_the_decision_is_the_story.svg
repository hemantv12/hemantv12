<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">The milestone isn't the insight — founder-led marketing</title>
<desc id="desc">A coral editorial poster for startup founders. It explains how to turn a real business decision into a useful founder-led marketing note using context, choice and learning.</desc>
<defs>
  <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
    <circle cx="3" cy="5" r="0.7" fill="#20271F" opacity=".10"/>
    <circle cx="15" cy="16" r="0.55" fill="#20271F" opacity=".08"/>
  </pattern>
  <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="150%">
    <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
    <feOffset dx="10" dy="13" result="offset"/>
    <feComponentTransfer><feFuncA type="linear" slope=".22"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- Full-bleed coral field; intentionally not a repeated olive/lime template. -->
<rect width="1080" height="1350" fill="#FF674D"/>
<path d="M0 0H1080V26H0Z" fill="#20271F"/>
<path d="M0 1314H1080V1350H0Z" fill="#20271F"/>
<path d="M900 0H1080V270L1032 238L986 270L948 226Z" fill="#D7F36B"/>
<path d="M0 1035L48 1007L91 1045L48 1081Z" fill="#D7F36B"/>

<!-- Exact official AA mark is loaded from the official vector asset; no redraw. -->
<image x="72" y="64" width="72" height="72" href="https://aagrowthstudio.com/assets/aa-symbol.svg" xlink:href="https://aagrowthstudio.com/assets/aa-symbol.svg" preserveAspectRatio="xMidYMid meet"/>
<text x="166" y="105" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="900" letter-spacing=".4">AA GROWTH STUDIO</text>
<text x="168" y="132" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="2.8">STRATEGY / CREATIVE / DIGITAL</text>
<text x="1008" y="98" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="2">FOUNDER NOTES</text>
<text x="1008" y="124" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="1.7">FIELD GUIDE 01 / 10 NOV 2026</text>

<!-- Cut-paper editorial sheet, not a rounded card. -->
<path d="M62 194L1014 170L1000 1204L82 1228L55 1118L74 1000L55 860L74 700L54 560L73 420Z" fill="#20271F" opacity=".18" transform="translate(12 12)"/>
<path d="M62 194L1014 170L1000 1204L82 1228L55 1118L74 1000L55 860L74 700L54 560L73 420Z" fill="#F3EFE6" filter="url(#paperShadow)"/>
<path d="M62 194L1014 170L1000 1204L82 1228L55 1118L74 1000L55 860L74 700L54 560L73 420Z" fill="url(#grain)"/>

<text x="108" y="276" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="3.4">FOUNDER-LED MARKETING</text>
<text x="108" y="388" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" letter-spacing="-4.2">THE MILESTONE</text>
<text x="108" y="482" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" letter-spacing="-4.2">ISN'T THE</text>
<text x="108" y="590" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-5.5">INSIGHT.</text>

<path d="M110 640H952" stroke="#20271F" stroke-width="2.5"/>
<text x="110" y="704" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="600">A milestone says what happened.</text>
<text x="110" y="750" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="900">A decision shows how you think.</text>
<path d="M782 665L926 665L926 738" fill="none" stroke="#FF674D" stroke-width="9" stroke-linecap="square"/>
<path d="M904 716L926 740L949 716" fill="none" stroke="#FF674D" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter"/>

<text x="110" y="832" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="900" letter-spacing="2.8">TURN ONE REAL DECISION INTO A USEFUL FOUNDER NOTE</text>

<!-- Three editorial columns, separated by rules rather than cards. -->
<path d="M110 874H952" stroke="#20271F" stroke-width="1.6" opacity=".42"/>
<path d="M390 874V1088M670 874V1088" stroke="#20271F" stroke-width="1.4" opacity=".28"/>

<text x="110" y="950" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="-2">01</text>
<text x="110" y="994" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">CONTEXT</text>
<text x="110" y="1035" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">What constraint</text>
<text x="110" y="1062" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">actually mattered?</text>

<text x="420" y="950" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="-2">02</text>
<text x="420" y="994" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">CHOICE</text>
<text x="420" y="1035" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">What did you decide</text>
<text x="420" y="1062" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">— and leave out?</text>

<text x="700" y="950" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="-2">03</text>
<text x="700" y="994" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">LEARNING</text>
<text x="700" y="1035" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">What would you</text>
<text x="700" y="1062" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">repeat or rethink?</text>

<path d="M110 1120H952" stroke="#20271F" stroke-width="2.5"/>
<text x="110" y="1168" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700">Share the thinking. Protect the confidential details.</text>
<text x="110" y="1200" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="1.2">AAGROWTHSTUDIO.COM ↗</text>

<text x="72" y="1285" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="2">AA GROWTH STUDIO</text>
<text x="1008" y="1285" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="900" letter-spacing="2">THOUGHTFUL GROWTH / REAL WORK</text>
</svg>