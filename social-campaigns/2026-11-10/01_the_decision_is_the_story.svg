<text x="110" y="950" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="-2">01</text>
<text x="110" y="994" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">CONTEXT</text>
