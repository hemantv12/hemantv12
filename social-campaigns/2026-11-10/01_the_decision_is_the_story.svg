<text x="110" y="1062" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">actually mattered?</text>

<text x="420" y="950" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="54" font-weight="900" letter-spacing="-2">02</text>
<text x="420" y="994" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.2">CHOICE</text>
<text x="420" y="1035" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="500">What did you decide</text>
