<title id="title">Ask One Useful Question</title>
<desc id="desc">Lime and cobalt branching diagram showing how one useful qualifier can route a lead toward a quote, consultation or relevant resource.</desc>

<rect width="1080" height="1350" fill="#D7F36B"/><path d="M0 0H1080V18H0Z" fill="#20271F"/><g transform="translate(72 54) scale(0.152344)"><svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-labelledby="t d"><title id="t">AA Growth Studio — Official profile image</title><desc id="d">The exact AA symbol used on the AA Growth Studio website, preserved as vector artwork for crisp resizing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282c22"/><stop offset="1" stop-color="#10120e"/></linearGradient></defs><rect x="3" y="3" width="90" height="90" rx="28" fill="url(#g)"/><path d="M17 58C10 36 31 13 53 15c17 1 29 12 29 27" fill="none" stroke="#d7f36b" stroke-width="2.3" stroke-linecap="round"/><circle cx="81" cy="42" r="4.3" fill="#ff674d"/><path d="M22 70 38 29h9l17 41H52l-3.2-9H36.4l-3.1 9Zm17-17h7l-3.5-10Z" fill="#f3efe6"/><path d="M53 70 67 34h8L89 70H78l-2.6-8H65.1l-2.7 8Z" fill="#d7f36b"/><path d="M65 55h7l-3.5-9Z" fill="#171914"/><path d="M20 77h56" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/></svg></g>
<text x="168" y="103" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" letter-spacing=".5">AA GROWTH</text><text x="168" y="133" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="2.8">STUDIO</text><text x="1008" y="100" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">03 / 05</text>
<text x="72" y="270" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="94" font-weight="900" letter-spacing="-3">ASK ONE</text><text x="72" y="365" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="84" font-weight="900" letter-spacing="-3">USEFUL QUESTION.</text><path d="M72 430H1008" stroke="#20271F" stroke-width="5"/>
<text x="72" y="535" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="2">TRY THIS PROMPT</text><text x="72" y="645" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" letter-spacing="-2">“WHAT ARE YOU</text><text x="72" y="725" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="66" font-weight="900" letter-spacing="-2">LOOKING TO GET DONE?”</text>
<path d="M105 790V1160M105 835H175M105 950H175M105 1065H175" stroke="#2847C7" stroke-width="5" fill="none"/><circle cx="105" cy="835" r="12" fill="#FF674D" stroke="#20271F" stroke-width="3"/><circle cx="105" cy="950" r="12" fill="#FF674D" stroke="#20271F" stroke-width="3"/><circle cx="105" cy="1065" r="12" fill="#FF674D" stroke="#20271F" stroke-width="3"/>
<text x="205" y="850" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="900">QUOTE</text><text x="1008" y="850" text-anchor="end" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="1">SCOPE THE REQUEST →</text><path d="M205 880H1008" stroke="#20271F" stroke-width="2" opacity=".25"/>
<text x="205" y="965" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="900">CONSULTATION</text><text x="1008" y="965" text-anchor="end" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="1">ROUTE TO A CALL →</text><path d="M205 995H1008" stroke="#20271F" stroke-width="2" opacity=".25"/>
<text x="205" y="1080" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="900">STILL EXPLORING</text><text x="1008" y="1080" text-anchor="end" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="1">SEND A USEFUL RESOURCE →</text>
<text x="72" y="1215" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800">Choose answers that change eligibility, routing or follow-up.</text><text x="72" y="1262" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="800">Don't ask for trivia. Ask what helps you take the right next step.</text>
