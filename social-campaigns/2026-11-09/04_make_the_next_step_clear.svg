<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Don't Make the Next Step a Mystery</title>
<desc id="desc">Coral poster with a conceptual after-submit response slip that reminds businesses to explain who follows up, how they reach out, what to expect and where the privacy policy lives.</desc>

<rect width="1080" height="1350" fill="#FF674D"/><path d="M0 0H1080V18H0Z" fill="#20271F"/><g transform="translate(72 54) scale(0.160156)"><svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-labelledby="t d"><title id="t">AA Growth Studio — Official profile image</title><desc id="d">The exact AA symbol used on the AA Growth Studio website, preserved as vector artwork for crisp resizing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282c22"/><stop offset="1" stop-color="#10120e"/></linearGradient></defs><rect x="3" y="3" width="90" height="90" rx="28" fill="url(#g)"/><path d="M17 58C10 36 31 13 53 15c17 1 29 12 29 27" fill="none" stroke="#d7f36b" stroke-width="2.3" stroke-linecap="round"/><circle cx="81" cy="42" r="4.3" fill="#ff674d"/><path d="M22 70 38 29h9l17 41H52l-3.2-9H36.4l-3.1 9Zm17-17h7l-3.5-10Z" fill="#f3efe6"/><path d="M53 70 67 34h8L89 70H78l-2.6-8H65.1l-2.7 8Z" fill="#d7f36b"/><path d="M65 55h7l-3.5-9Z" fill="#171914"/><path d="M20 77h56" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/></svg></g>
   <text x="172" y="93.36" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" letter-spacing=".5">AA GROWTH</text>
   <text x="172" y="117.96000000000001" fill="#F4F0E7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="2.8">STUDIO</text>
   <text x="1008" y="78" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" letter-spacing="2">04 / 05</text>
<text x="72" y="265" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" letter-spacing="-2">DON'T MAKE THE</text><text x="72" y="370" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="108" font-weight="900" letter-spacing="-4">NEXT STEP</text><text x="72" y="485" fill="#F4F0E7" font-family="Arial,Helvetica,sans-serif" font-size="112" font-weight="900" letter-spacing="-4">A MYSTERY.</text>
<g transform="translate(150 560)"><path d="M0 0H780V520H0Z" fill="#F4F0E7" stroke="#20271F" stroke-width="4"/><path d="M0 0L390 270 780 0" fill="none" stroke="#2847C7" stroke-width="5"/><path d="M0 520L270 285M780 520L510 285" fill="none" stroke="#2847C7" stroke-width="5"/><text x="48" y="82" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="900" letter-spacing="2">CONCEPTUAL EXAMPLE / AFTER SUBMIT</text><text x="48" y="160" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">WHO FOLLOWS UP?</text><path d="M48 184H730" stroke="#20271F" stroke-width="2" opacity=".2"/><text x="48" y="250" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">HOW WILL THEY REACH OUT?</text><path d="M48 274H730" stroke="#20271F" stroke-width="2" opacity=".2"/><text x="48" y="340" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="42" font-weight="900">WHAT SHOULD I EXPECT?</text><path d="M48 364H730" stroke="#20271F" stroke-width="2" opacity=".2"/><text x="48" y="440" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">PRIVACY POLICY: EASY TO FIND</text></g>
<text x="72" y="1170" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="800">State the real process. Link your privacy policy.</text><text x="72" y="1220" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="700">Never promise a response window your team can't meet.</text><text x="1008" y="1300" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" letter-spacing="2">AA GROWTH STUDIO</text>
</svg>