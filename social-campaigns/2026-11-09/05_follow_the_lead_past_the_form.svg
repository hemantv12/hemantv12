<text x="72" y="260" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="80" font-weight="900" letter-spacing="-3">FOLLOW THE LEAD</text><text x="72" y="365" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="900" letter-spacing="-4">PAST THE FORM.</text><text x="72" y="445" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="800">A form submission is the start of the record—not the end.</text>
