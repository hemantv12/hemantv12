<path d="M72 990H1008" stroke="#20271F" stroke-width="3"/><text x="72" y="1060" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="2">YOUR NEXT STEP</text><text x="72" y="1120" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">Open your current form. Remove one unused field.</text><text x="72" y="1170" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="900">Add one question that changes follow-up.</text><text x="72" y="1250" fill="#2847C7" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">Need a clearer lead journey? www.aagrowthstudio.com</text>
