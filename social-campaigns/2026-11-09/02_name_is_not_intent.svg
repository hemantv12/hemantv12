<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">A Name Is Not a Qualifier</title>
<desc id="desc">Warm-paper receipt illustration showing that a name, email and phone number are contact details, not proof of fit or buying intent.</desc>

<rect width="1080" height="1350" fill="#F4F0E7"/><path d="M0 0H1080V18H0Z" fill="#FF674D"/><g transform="translate(914 58) scale(0.179688)"><svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" role="img" aria-labelledby="t d"><title id="t">AA Growth Studio — Official profile image</title><desc id="d">The exact AA symbol used on the AA Growth Studio website, preserved as vector artwork for crisp resizing.</desc><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282c22"/><stop offset="1" stop-color="#10120e"/></linearGradient></defs><rect x="3" y="3" width="90" height="90" rx="28" fill="url(#g)"/><path d="M17 58C10 36 31 13 53 15c17 1 29 12 29 27" fill="none" stroke="#d7f36b" stroke-width="2.3" stroke-linecap="round"/><circle cx="81" cy="42" r="4.3" fill="#ff674d"/><path d="M22 70 38 29h9l17 41H52l-3.2-9H36.4l-3.1 9Zm17-17h7l-3.5-10Z" fill="#f3efe6"/><path d="M53 70 67 34h8L89 70H78l-2.6-8H65.1l-2.7 8Z" fill="#d7f36b"/><path d="M65 55h7l-3.5-9Z" fill="#171914"/><path d="M20 77h56" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/></svg></g>
<text x="1008" y="178" text-anchor="end" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">AA GROWTH STUDIO</text><text x="1008" y="214" text-anchor="end" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="900" letter-spacing="2">02 / 05</text>
<text x="72" y="260" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="78" font-weight="900" letter-spacing="-2">A NAME IS NOT</text><text x="72" y="350" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="94" font-weight="900" letter-spacing="-3">A QUALIFIER.</text><text x="72" y="420" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" letter-spacing="2">PREFILLED DETAILS MAKE SUBMISSION EASY.</text>
<g transform="translate(170 500)"><path d="M0 0H740V620L718 640 696 620 674 640 652 620 630 640 608 620 586 640 564 620 542 640 520 620 498 640 476 620 454 640 432 620 410 640 388 620 366 640 344 620 322 640 300 620 278 640 256 620 234 640 212 620 190 640 168 620 146 640 124 620 102 640 80 620 58 640 36 620 14 640 0 620Z" fill="#FFFFFF" stroke="#20271F" stroke-width="3"/><text x="52" y="82" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="900" letter-spacing="2">FORM RECEIPT</text><path d="M52 108H688" stroke="#20271F" stroke-width="2" opacity=".22"/><text x="52" y="178" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900">NAME</text><text x="688" y="178" text-anchor="end" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800">CONTACT DETAIL</text><path d="M52 204H688" stroke="#20271F" stroke-width="2" opacity=".2"/><text x="52" y="274" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900">EMAIL</text><text x="688" y="274" text-anchor="end" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800">CONTACT DETAIL</text><path d="M52 300H688" stroke="#20271F" stroke-width="2" opacity=".2"/><text x="52" y="370" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900">PHONE</text><text x="688" y="370" text-anchor="end" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800">CONTACT DETAIL</text><path d="M52 404H688" stroke="#20271F" stroke-width="2" opacity=".2"/><g transform="rotate(-8 370 500)"><rect x="82" y="442" width="576" height="96" fill="#FF674D"/><text x="370" y="508" text-anchor="middle" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="900" letter-spacing="-1">CONTACT ≠ FIT</text></g><text x="52" y="590" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="19" font-weight="800" letter-spacing="1.4">A FORM STILL NEEDS A CLEAR OFFER + A USEFUL QUESTION.</text></g>
<text x="72" y="1215" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">The offer and the questions have to do the qualifying.</text><text x="72" y="1270" fill="#68745A" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700">Don't mistake a completed form for a ready-to-buy conversation.</text>
</svg>