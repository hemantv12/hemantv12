<text x="76" y="520" fill="#315BFF" font-family="Arial,Helvetica,sans-serif" font-size="118" font-weight="900" letter-spacing="-5">THE STORY.</text>
<text x="80" y="584" fill="#4B5563" font-family="Georgia,serif" font-size="29" font-style="italic">A click carries an expectation. The page should confirm it.</text>
