<text x="76" y="1062" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">Does the first headline</text>
<text x="76" y="1092" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">echo the ad's core benefit?</text>
