<text x="432" y="1022" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="900">OFFER</text>
<text x="432" y="1062" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">Is the product, bundle or</text>
<text x="432" y="1092" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">price visible right away?</text>
