<text x="76" y="91" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="800" letter-spacing="4">META ADS / POST-CLICK EXPERIENCE</text>
<text x="76" y="133" fill="#6B7280" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" letter-spacing="2">AA GROWTH STUDIO  ·  FIELD NOTE 01</text>
