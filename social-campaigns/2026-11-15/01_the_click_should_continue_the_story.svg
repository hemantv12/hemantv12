<text x="76" y="1214" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="900" letter-spacing="-1">ONE CLICK. ONE CONTINUOUS PROMISE.</text>
<text x="76" y="1270" fill="#315BFF" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">BUILD THE HANDOFF  →  AAGROWTHSTUDIO.COM</text>
