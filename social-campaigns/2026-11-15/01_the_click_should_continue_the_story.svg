<text x="770" y="1062" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">Does the page continue</text>
<text x="770" y="1092" fill="#374151" font-family="Arial,Helvetica,sans-serif" font-size="22">the action the ad invited?</text>
