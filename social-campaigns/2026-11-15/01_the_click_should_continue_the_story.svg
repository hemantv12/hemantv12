<title id="title">The Click Should Continue the Story — AA Growth Studio</title>
<desc id="desc">A high-contrast minimalist editorial poster for US ecommerce founders. A cobalt line begins at an ad promise and breaks before the landing page, visualizing a post-click message mismatch. Three checks cover promise, offer and next step.</desc>
<rect width="1080" height="1350" fill="#F9FAFC"/>
