<path d="M640 891L681 925L640 960" fill="none" stroke="#D7F36B" stroke-width="22" stroke-linecap="square" stroke-linejoin="miter"/>
<rect x="128" y="910" width="260" height="86" fill="#D7F36B" stroke="#20271F" stroke-width="4"/>
<text x="258" y="963" text-anchor="middle" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">GUEST CHECKOUT</text>
<text x="70" y="1120" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="900">Let people buy first.</text>
<text x="70" y="1164" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600">Make guest checkout easy to spot.</text>
<text x="70" y="1200" fill="#20271F" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600">Offer account creation after the order.</text>
