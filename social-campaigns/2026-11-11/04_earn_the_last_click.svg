<text x="70" y="1120" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">When will it arrive?</text>
<text x="70" y="1160" fill="#D7F36B" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700">What if it isn't right?</text>
<text x="70" y="1214" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">Show a realistic delivery estimate, a concise return summary,</text>
<text x="70" y="1248" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="600">clear payment choices and helpful error messages.</text>
<text x="70" y="1305" fill="#D7F36B" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="900" letter-spacing="1.1">AAGROWTHSTUDIO.COM ↗</text>
