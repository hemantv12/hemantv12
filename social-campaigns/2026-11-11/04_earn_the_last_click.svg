<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
<title id="title">Earn the Last Click — Delivery, Returns and Payment Clarity</title><desc id="desc">A deep teal vector editorial illustration of a shipping parcel, delivery calendar, return loop and payment card. It shows the last questions a shopper needs answered before placing an order.</desc>
<rect width="1080" height="1350" fill="#123C3A"/>
<path d="M0 0H1080V18H0Z" fill="#D7F36B"/>

<g transform="translate(840 58)">
  <svg width="64" height="64" viewBox="0 0 96 96" role="img" aria-label="Official AA Growth Studio mark">
    <defs><linearGradient id="aa-official-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#282c22"/><stop offset="1" stop-color="#10120e"/></linearGradient></defs>
    <rect x="3" y="3" width="90" height="90" rx="28" fill="url(#aa-official-g)"/>
    <path d="M17 58C10 36 31 13 53 15c17 1 29 12 29 27" fill="none" stroke="#d7f36b" stroke-width="2.3" stroke-linecap="round"/>
    <circle cx="81" cy="42" r="4.3" fill="#ff674d"/>
    <path d="M22 70 38 29h9l17 41H52l-3.2-9H36.4l-3.1 9Zm17-17h7l-3.5-10Z" fill="#f3efe6"/>
    <path d="M53 70 67 34h8L89 70H78l-2.6-8H65.1l-2.7 8Z" fill="#d7f36b"/>
    <path d="M65 55h7l-3.5-9Z" fill="#171914"/>
    <path d="M20 77h56" stroke="#ffffff" stroke-opacity=".18" stroke-width="1"/>
  </svg>
  <text x="78" y="30" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" letter-spacing=".3">AA GROWTH</text>
  <text x="80" y="51" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="800" letter-spacing="2.5">STUDIO</text>
</g>
<text x="70" y="230" fill="#D7F36B" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="900" letter-spacing="3">03 / DECISION CONFIDENCE</text>
<text x="70" y="345" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="70" font-weight="900" letter-spacing="-3">ANSWER THE</text>
<text x="70" y="440" fill="#F3EFE6" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-4">LAST TWO</text>
<text x="70" y="535" fill="#FF674D" font-family="Arial,Helvetica,sans-serif" font-size="92" font-weight="900" letter-spacing="-4">QUESTIONS.</text>
