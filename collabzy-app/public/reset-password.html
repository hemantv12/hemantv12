<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211942"><title>Reset password · Collabzy</title>
<style>body{margin:0;background:#f7f6fb;color:#241f38;font:16px/1.6 system-ui,sans-serif}main{max-width:540px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e9e5f2;border-radius:22px}a{color:#7056e8}.field{display:grid;gap:6px;margin:14px 0}input{width:100%;box-sizing:border-box;border:1px solid #e3e0ed;border-radius:11px;padding:12px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 18px;background:#7056e8;color:#fff;font-weight:750;font:inherit;cursor:pointer}#message{color:#706b82}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head>
<body><main><a href="/">← Collabzy home</a><h1>Choose a new password</h1><p id="message">Reset links expire after one hour and can be used once.</p><form id="form"><div class="field"><label for="password">New password</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></div><div class="field"><label for="confirm">Confirm new password</label><input id="confirm" type="password" autocomplete="new-password" minlength="8" maxlength="200" required></div><button class="btn">Reset password</button></form><p><a href="/">Return to sign in</a></p></main>
<script>
const token=new URLSearchParams(location.search).get('token'),form=document.getElementById('form'),message=document.getElementById('message');form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value,confirm=document.getElementById('confirm').value;if(password!==confirm){message.textContent='Passwords do not match.';return}if(!token){message.textContent='This reset link is missing its token. Request a new one from sign in.';return}const button=form.querySelector('button');button.disabled=true;button.textContent='Resetting…';try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Could not reset your password.');message.textContent='Password reset successfully. All earlier sessions have been invalidated; please sign in again.';form.style.display='none';history.replaceState({},'',location.pathname)}catch(error){message.textContent=error.message;button.disabled=false;button.textContent='Reset password'}})
</script></body></html>
