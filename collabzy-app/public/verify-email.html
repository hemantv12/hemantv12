<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#211942"><title>Verify email · Collabzy</title>
<style>body{margin:0;background:#f7f6fb;color:#241f38;font:16px/1.6 system-ui,sans-serif}main{max-width:540px;margin:10vh auto;padding:28px;background:#fff;border:1px solid #e9e5f2;border-radius:22px}a{color:#7056e8}.btn{border:0;border-radius:12px;padding:12px 18px;background:#7056e8;color:#fff;font-weight:750;font:inherit;cursor:pointer}#message{color:#706b82}@media(max-width:600px){main{margin:12px;padding:20px}}</style></head>
<body><main><a href="/">← Collabzy home</a><h1>Verify your email</h1><p id="message">Confirm that you control the email address used to create your Collabzy account.</p><button id="verify" class="btn">Verify email address</button><p><a href="/">Return to sign in</a></p></main>
<script>
const token=new URLSearchParams(location.search).get('token');const button=document.getElementById('verify'),message=document.getElementById('message');
button.addEventListener('click',async()=>{if(!token){message.textContent='This verification link is missing its token. Request a new one from sign in.';button.disabled=true;return}button.disabled=true;button.textContent='Verifying…';try{const response=await fetch('/api/auth/verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});const data=await response.json().catch(()=>({}));if(!response.ok)throw Error(data.error||'Could not verify this link.');message.textContent='Email verified successfully. You can now sign in to Collabzy.';button.textContent='Verified';button.style.display='none';history.replaceState({},'',location.pathname)}catch(error){message.textContent=error.message;button.disabled=false;button.textContent='Try again'}})
</script></body></html>
