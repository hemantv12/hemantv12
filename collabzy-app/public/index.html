:root{--ink:#241735;--muted:#71667f;--purple:#7047f2;--line:#eae3f4;--bg:#faf8ff;--white:#fff}
html{scroll-behavior:smooth}

function inviteCreator(id){const active=myCampaigns.filter(c=>c.status==='active');if(!active.length){toast('Publish an active campaign first, then invite creators.');return}document.querySelector('#inviteModal')?.remove();document.body.insertAdjacentHTML('beforeend','<div id="inviteModal" class="modal"><section class="modalcard"><button class="modalclose" onclick="document.querySelector(\'#inviteModal\')?.remove()" aria-label="Close">×</button><div class="eyebrow">CREATOR OUTREACH</div><h2>Invite to a campaign</h2><form id="inviteForm"><div class="field"><label>Your active campaign</label><select name="campaign_id" required>'+active.map(c=>'<option value="'+c.id+'">'+esc(c.title)+'</option>').join('')+'</select></div><div class="field"><label>Personal message</label><textarea name="message" rows="4" maxlength="1000" placeholder="Tell the creator why they are a good fit for this collaboration."></textarea></div><div class="actions"><button class="btn" type="submit">Send invitation</button><button class="btn alt" type="button" onclick="document.querySelector(\'#inviteModal\')?.remove()">Cancel</button></div></form></section></div>');const modal=$('#inviteModal');$('#inviteForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),campaignId=Number(f.get('campaign_id')),button=e.target.querySelector('button[type=submit]');button.disabled=true;try{await api('/campaigns/'+campaignId+'/invite',{method:'POST',body:JSON.stringify({creator_id:id,message:f.get('message')})});modal.remove();await Promise.all([loadInvitations(),loadNotifications(),loadDashboard()]);toast('Invitation sent to creator.')}catch(err){toast(err.message);button.disabled=false}}}

function profileProgress(){const items=[['Niche',me.niche],['Bio',me.bio],['Location',me.location],['Instagram handle',me.instagram_handle]],done=items.filter(x=>String(x[1]||'').trim()).length;return {percent:Math.round(done/items.length*100),missing:items.filter(x=>!String(x[1]||'').trim()).map(x=>x[0])}}

function renderAppNavigation(){
  const core=[
    {key:'discover',label:'Explore',icon:'⌂',primary:true},
    {key:'matches',label:'Match',icon:'✦',primary:true},
    {key:'messages',label:'Inbox',icon:'◉',primary:true},
    {key:'more',label:'More',icon:'•••',primary:true},
    {key:'profile',label:'Profile',icon:'◎',primary:true}
  ];
  const extra=[
    {key:'applications',label:'Applications',icon:'▤'},
    {key:'invitations',label:'Invitations',icon:'↗'},
    {key:'saved',label:'Saved campaigns',icon:'☆'},
    {key:'notifications',label:'Alerts',icon:'♧'},
    {key:'instagram',label:'Instagram insights',icon:'◎'},
    {key:'ai',label:'AI Studio',icon:'✧'}
  ];
  if(me.role==='creator')extra.push({key:'autodm',label:'Instagram Auto DM',icon:'↗'});
  if(me.role==='brand'){extra.push({key:'mycampaigns',label:'My campaigns',icon:'▣'},{key:'creators',label:'Find creators',icon:'♙'});}
  const moreActive=!['discover','matches','messages','profile'].includes(page);
  return '<nav class="nav app-tabbar" aria-label="Collabzy navigation">'+[...core,...extra].map(item=>{
    const active=page===item.key||(item.key==='more'&&moreActive);
    const click=item.key==='more'?'openMoreSheet()':"go('"+item.key+"')";
    const label=item.key==='messages'?(Number(dashboard.unreadMessages||0)?'Inbox · '+Number(dashboard.unreadMessages):'Inbox'):item.label;
    return '<button type="button" class="'+(active?'active':'')+'" data-nav-key="'+item.key+'" data-primary="'+(item.primary?'true':'false')+'" aria-label="'+item.label+'" onclick="'+click+'"><span class="tab-icon">'+item.icon+'</span><span class="tab-label">'+label+'</span></button>';
  }).join('')+'</nav>';
}

cker">MANAGE</span><strong>Your campaigns</strong><p>Edit briefs, close listings and review applicant totals.</p><span class="quick-link">Manage campaigns →</span></button>':'<div class="quick-card profile-progress"><div class="progress-row"><span class="quick-kicker">YOUR PROFILE</span><b>'+profileProgress().percent+'% complete</b></div><strong>Make your profile stand out</strong><p>'+(profileProgress().missing.length?'Add '+profileProgress().missing.slice(0,2).join(' and ').toLowerCase()+' to help brands discover you.':'Your basic profile is complete. Keep it current for brands.')+'</p><div class="progress-track"><span style="width:'+profileProgress().percent+'%"></span></div><button class="quick-link" onclick="go(\'profile\')">Improve profile →</button></div><button class="quick-card" onclick="go(\'discover\')"><span class="quick-kicker">OPPORTUNITIES</span><strong>Explore campaigns</strong><p>Search by category, collaboration type and budget.</p><span class="quick-link">Browse campaigns →</span></button><button class="quick-card" onclick="go(\'saved\')"><span class="quick-kicker">SHORTLIST</span><strong>Saved campaigns</strong><p>Keep interesting opportunities close at hand.</p><span class="quick-link">View saved →</span></button>'}</section>${renderAppNavigation()}<section id="view"></section><div class="foot">Collabzy · Built for creators and brands · Be genuine. Create impact.</div>`;renderPage()}
async function go(p){
  closeMoreSheet();page=p;
  document.querySelectorAll('[data-nav-key]').forEach(button=>{
    const key=button.getAttribute('data-nav-key');
    button.classList.toggle('active',key===p||(key==='more'&&!['discover','matches','messages','profile'].includes(p)));
  });
  renderPage();
  const view=$('#view');
  if(view){view.classList.remove('app-screen-enter');void view.offsetWidth;view.classList.add('app-screen-enter')}
  if(IS_NATIVE_APP)window.scrollTo({top:0,behavior:'auto'});
}

async function runAIStudio(event){
  event.preventDefault();
  const form=$('#aiStudioForm'),output=$('#aiResult'),submit=form?.querySelector('button[type="submit"]');
  if(!form||!output)return;
  const data=new FormData(form),brief=String(data.get('brief')||'').trim(),audience=String(data.get('audience')||'').trim(),tone=String(data.get('tone')||'warm and confident').trim();
  if(!data.get('confirmed_ai_disclosure')){toast('Please confirm the AI data-use note first.');return}
  if(brief.length<4){toast('Add a little context so the draft is useful.');return}
  if(submit){submit.disabled=true;submit.textContent='Creating your draft…'}
  output.innerHTML='<div class="note">Preparing a tailored draft. This can take a few seconds.</div>';
  try{
    const d=await api('/ai/studio',{method:'POST',body:JSON.stringify({tool:String(data.get('tool')||''),brief,audience,tone,confirmed_ai_disclosure:true})});
    aiStudioLatestOutput=String(d.output||'');
    const notice=d.mode==='starter_template'?'<div class="note"><b>Starter draft mode.</b> '+esc(d.notice||'Configure the protected AI provider to enable live generative output.')+'</div>':'<div class="note">Generated with '+esc(d.model||'Collabzy AI')+'. Review the draft before publishing or sending.</div>';
    output.innerHTML=notice+'<article class="ai-output-card"><div class="eyebrow">YOUR DRAFT</div><h3>'+esc(d.title||'Your Collabzy draft')+'</h3><div class="ai-output">'+esc(aiStudioLatestOutput)+'</div><div class="actions" style="margin-top:12px"><button type="button" class="btn alt" onclick="copyStudioOutput()">Copy draft</button></div></article>'+(Array.isArray(d.steps)&&d.steps.length?'<article class="panel" style="margin-top:12px"><h3>Before you use it</h3><ul>'+d.steps.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></article>':'');
  }catch(error){output.innerHTML='<div class="note">'+esc(error.message||'AI Studio is not available right now.')+'</div>';toast(error.message||'Could not create draft.')}
  finally{if(submit){submit.disabled=false;submit.textContent='Generate draft ✦'}}
}
async function copyStudioOutput(){
  if(!aiStudioLatestOutput){toast('Generate a draft first.');return}
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(aiStudioLatestOutput);toast('Draft copied.')}else prompt('Copy your draft:',aiStudioLatestOutput)}catch{prompt('Copy your draft:',aiStudioLatestOutput)}
}
async function loadAutomations(){
  try{
    const d=await api('/instagram/automations');automationRules=d.rules||[];automationMeta={configured:!!d.configured,connected:!!d.connected,message:d.message||''};
    const status=$('#dmStatus');
    if(status)status.innerHTML='<div class="note"><b>'+(automationMeta.configured?'Meta automation configured':'Live sending is locked')+'</b><br>'+esc(automationMeta.message)+(automationMeta.connected?'<br><span class="pill green">@'+esc(me.instagram_handle||'Instagram connected')+' connected</span>':'<br><span class="pill">Instagram not connected</span>')+'</div>';
    const setup=$('#dmSetupButton');if(setup){setup.disabled=!(automationMeta.configured&&automationMeta.connected);setup.textContent=automationMeta.configured&&automationMeta.connected?'Subscribe to Instagram comments':'Meta setup required'}
    renderAutomationRules();loadAutomationEvents();
  }catch(error){
    automationRules=[];automationMeta={configured:false,connected:false,message:error.message||'Could not load rules.'};
    const status=$('#dmStatus');if(status)status.innerHTML='<div class="note">'+esc(automationMeta.message)+'</div>';
    renderAutomationRules();loadAutomationEvents();
  }
}

async function loadAutomationEvents(){
 try{const data=await api('/instagram/automations/events');automationEvents=Array.isArray(data.events)?data.events:[];renderAutomationEvents()}
 catch(error){automationEvents=[];renderAutomationEvents(error.message||'Activity is temporarily unavailable.')}
}
function renderAutomationEvents(errorText=''){
 const target=$('#dmEvents');if(!target)return;
 if(!automationEvents.length){target.innerHTML='<div class="empty">'+esc(errorText||'No reply activity yet. Once an enabled rule handles an eligible Instagram comment, its delivery status appears here.')+'</div>';return}
 target.innerHTML=automationEvents.map(event=>{let when='Time unavailable';try{when=new Date(event.created_at).toLocaleString()}catch{}const status=String(event.status||'unknown').toLowerCase(),label=status==='sent'?'Sent':status==='failed'?'Failed':status==='processing'?'Processing':'Received';return '<article class="card event-row"><div class="cardtop"><div><span class="eyebrow">KEYWORD</span><h3>'+esc(event.keyword||'Removed rule')+'</h3></div><span class="pill '+(status==='sent'?'green':status==='failed'?'red':'')+'">'+label+'</span></div><p class="desc">'+esc(when)+(event.response_code?' · API '+Number(event.response_code):'')+'</p>'+(event.message?'<p class="desc">'+esc(event.message)+'</p>':'')+'</article>'}).join('');
}

function renderAutomationRules(){
  const target=$('#dmRules');if(!target)return;
  if(!automationRules.length){target.innerHTML='<div class="empty">No rules yet. Create a keyword reply above; it will be saved disabled until live Meta automation is ready.</div>';return}
  target.innerHTML=automationRules.map(rule=>'<article class="card rule-card"><div class="cardtop"><div><span class="eyebrow">COMMENT KEYWORD</span><h3>'+esc(rule.keyword)+'</h3></div><span class="pill '+(rule.enabled?'green':'')+'">'+(rule.enabled?'Enabled':'Draft / paused')+'</span></div><p class="desc">'+esc(rule.match_type==='exact'?'Exact match':'Contains keyword')+'</p><div class="ai-output">'+esc(rule.reply_text)+(rule.cta_url?'\n'+esc(rule.cta_url):'')+'</div><div class="actions" style="margin-top:12px"><button class="btn alt" onclick="copyDmReply('+Number(rule.id)+')">Copy reply</button><button class="btn alt" '+(!automationMeta.configured||!automationMeta.connected?'disabled':'')+' onclick="toggleAutomation('+Number(rule.id)+','+(!rule.enabled)+')">'+(rule.enabled?'Pause rule':'Enable live')+'</button><button class="btn danger" onclick="deleteAutomation('+Number(rule.id)+')">Delete</button></div></article>').join('');
}
async function saveAutomation(event){
  event.preventDefault();const form=$('#dmForm');if(!form)return;
  const data=new FormData(form);
  try{
    const d=await api('/instagram/automations',{method:'POST',body:JSON.stringify({keyword:String(data.get('keyword')||''),match_type:String(data.get('match_type')||'contains'),reply_text:String(data.get('reply_text')||''),cta_url:String(data.get('cta_url')||'')})});
    toast(d.message||'Reply rule saved as draft.');form.reset();await loadAutomations();
  }catch(error){toast(error.message||'Could not save the rule.')}
}
async function toggleAutomation(id,enabled){
  try{const d=await api('/instagram/automations/'+Number(id),{method:'PATCH',body:JSON.stringify({enabled:!!enabled})});toast(d.message||'Rule updated.');await loadAutomations()}
  catch(error){toast(error.message||'Could not update the rule.');await loadAutomations()}
}
async function deleteAutomation(id){
  if(!confirm('Delete this keyword reply rule?'))return;
  try{await api('/instagram/automations/'+Number(id),{method:'DELETE'});toast('Rule deleted.');await loadAutomations()}
  catch(error){toast(error.message||'Could not delete the rule.')}
}
async function copyDmReply(id){
  const rule=automationRules.find(item=>Number(item.id)===Number(id));if(!rule)return;
  const value=String(rule.reply_text||'')+(rule.cta_url?'\n'+rule.cta_url:'');
  try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);toast('Reply copied.')}else prompt('Copy reply:',value)}catch{prompt('Copy reply:',value)}
}
async function setupInstagramAutomation(){
  try{const d=await api('/instagram/automations/setup',{method:'POST',body:JSON.stringify({})});toast(d.message||'Instagram comment webhook subscription requested.');await loadAutomations()}
  catch(error){toast(error.message||'Meta setup is incomplete.')}

 v.innerHTML='<div class="panel"><div class="eyebrow">BRAND WORKSPACE · EDIT CAMPAIGN</div><h2>Update your campaign</h2><p>Changes will be visible in the marketplace immediately.</p><form id="editCampaignForm"><div class="field"><label>Campaign title</label><input name="title" required maxlength="120" value="'+esc(c.title)+'"></div><div class="field"><label>Category</label><select name="category" required>'+categoryOptions+'</select></div><div class="field"><label>Collaboration type</label><select name="collaboration_type" required>'+typeOptions+'</select></div><div class="field"><label>Campaign brief</label><textarea name="description" required rows="5" maxlength="1500">'+esc(c.description||'')+'</textarea></div><div class="grid"><div class="field"><label>Minimum budget (₹)</label><input name="budget_min" type="number" min="0" max="100000000" required value="'+Number(c.budget_min||0)+'"></div><div class="field"><label>Maximum budget (₹)</label><input name="budget_max" type="number" min="0" max="100000000" required value="'+Number(c.budget_max||0)+'"></div></div><div class="field"><label>Deliverables</label><input name="deliverables" maxlength="300" value="'+esc(c.deliverables||'')+'"></div><div class="field"><label>Location</label><input name="location" maxlength="100" value="'+esc(c.location||'India')+'"></div><div class="actions"><button class="btn" type="submit">Save changes</button><button class="btn alt" type="button" id="cancelEditCampaign">Cancel</button></div></form></div>';
 $('#cancelEditCampaign').onclick=()=>go('mycampaigns');
 $('#editCampaignForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target)),low=Math.max(0,Number(b.budget_min)||0),high=Math.max(0,Number(b.budget_max)||0);if(high<low){toast('Maximum budget must be at least the minimum budget.');return}const button=e.target.querySelector('button[type=submit]');button.disabled=true;button.textContent='Saving…';try{await api('/campaigns/'+id,{method:'PATCH',body:JSON.stringify({...b,budget_min:low,budget_max:high})});toast('Campaign updated');await Promise.all([loadCampaigns(),loadMyCampaigns(),loadDashboard()]);shell()}catch(err){button.disabled=false;button.textContent='Save changes';toast(err.message)}};
}
function newCampaign(){
 if(me.role!=='brand'){toast('Only brand accounts can publish campaigns.');return}
 const v=$('#view');v.innerHTML='<div class="panel"><div class="eyebrow">BRAND WORKSPACE</div><h2>Publish a campaign</h2><p>Share a clear brief so creators know exactly what you need.</p><form id="campaignForm"><div class="field"><label>Campaign title</label><input name="title" required maxlength="120" placeholder="e.g. Summer product launch"></div><div class="field"><label>Category</label><select name="category" required><option value="">Choose category</option><option>Beauty</option><option>Fashion</option><option>Food</option><option>Fitness</option><option>Travel</option><option>Technology</option><option>Lifestyle</option><option>Gaming</option><option>Finance</option><option>Other</option></select></div><div class="field"><label>Collaboration type</label><select name="collaboration_type" required><option value="Paid">Paid</option><option value="Barter">Barter</option><option value="Hybrid">Hybrid</option></select></div><div class="field"><label>Campaign brief</label><textarea name="description" required rows="4" maxlength="1500" placeholder="Product, audience, key message, timeline and what creators should deliver."></textarea></div><div class="grid"><div class="field"><label>Minimum budget (₹)</label><input name="budget_min" type="number" min="0" max="100000000" value="3000" required></div><div class="field"><label>Maximum budget (₹)</label><input name="budget_max" type="number" min="0" max="100000000" value="10000" required></div></div><div class="field"><label>Deliverables</label><input name="deliverables" maxlength="300" placeholder="1 Reel + 3 Stories"></div><div class="field"><label>Location</label><input name="location" maxlength="100" value="India" placeholder="India / remote"></div><div class="actions"><button class="btn" type="submit">Publish campaign</button><button class="btn alt" type="button" id="cancelCampaign">Cancel</button></div></form></div>';
 $('#cancelCampaign').onclick=()=>go('discover');
 $('#campaignForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const low=Math.max(0,Number(b.budget_min)||0),high=Math.max(0,Number(b.budget_max)||0);if(high<low){toast('Maximum budget must be at least the minimum budget.');return}const button=e.target.querySelector('button[type=submit]');button.disabled=true;button.textContent='Publishing…';try{await api('/campaigns',{method:'POST',body:JSON.stringify({...b,budget_min:low,budget_max:high})});toast('Campaign published');await Promise.all([loadCampaigns(),loadMyCampaigns(),loadDashboard()]);shell()}catch(err){button.disabled=false;button.textContent='Publish campaign';toast(err.message)}};
}
function downloadMediaKit(){
 if(me.role!=='creator'){toast('Media kits are available for creator profiles.');return}
 const name=String(me.name||'Creator'),niche=String(me.niche||'Creator'),location=String(me.location||''),handle=String(me.instagram_handle||''),bio=String(me.bio||''),followers=Number(me.followers||0),engagement=Number(me.engagement||0),linked=!!me.instagram_connected;
 const h=x=>esc(x).replace(/\`/g,'&#96;');
 const content='<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+h(name)+' — Creator Media Kit</title><style>*{box-sizing:border-box}body{margin:0;padding:40px 18px;background:#f5f2ff;color:#231b3a;font:16px/1.6 Inter,system-ui,sans-serif}.sheet{max-width:780px;margin:auto;background:white;border-radius:24px;padding:36px;box-shadow:0 20px 65px #24194d16}.tag{font-size:11px;letter-spacing:2px;font-weight:800;color:#7056e8}.avatar{width:72px;height:72px;border-radius:24px;background:#211942;color:#c7baff;display:grid;place-items:center;font-size:30px;font-weight:900;margin:20px 0}h1{font-size:40px;line-height:1.1;letter-spacing:-1.5px;margin:8px 0}h2{font-size:19px;margin-top:28px}.muted{color:#77748a}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.stat{border:1px solid #eeecf4;border-radius:16px;padding:16px}.stat b{display:block;font-size:26px}.stat span{font-size:12px;color:#77748a}.bio{white-space:pre-wrap}.footer{border-top:1px solid #eeecf4;padding-top:18px;margin-top:32px;color:#77748a;font-size:12px}@media(max-width:550px){.sheet{padding:24px}.stats{grid-template-columns:1fr 1fr}h1{font-size:32px}}@media print{body{padding:0;background:white}.sheet{box-shadow:none;max-width:none}}</style></head><body><main class="sheet"><div class="tag">COLLABZY · CREATOR MEDIA KIT</div><div class="avatar">'+h(name.trim().slice(0,1).toUpperCase()||'C')+'</div><h1>'+h(name)+'</h1><p class="muted">'+h(niche)+(location?' · '+h(location):'')+'</p><div class="stats"><div class="stat"><b>'+followers.toLocaleString('en-IN')+'</b><span>Followers</span></div><div class="stat"><b>'+engagement.toLocaleString('en-IN')+'%</b><span>Engagement rate</span></div><div class="stat"><b>'+(linked?'Linked':'Creator')+'</b><span>'+(linked?'Instagram account':'Profile status')+'</span></div></div><h2>About</h2><p class="bio">'+h(bio||'Add a creator bio in your Collabzy profile to tell brands about your style, audience and work.')+'</p><h2>Instagram</h2><p>'+(handle?'@'+h(handle):'Add your Instagram handle to your Collabzy profile')+'</p><p class="muted">'+(linked?'Follower count synced from an authorized Instagram account.':'Follower and engagement figures are self-reported and have not been verified by Instagram.')+'</p><div class="footer">Prepared with Collabzy · Campaign opportunities, creator profiles and brand partnerships</div></main></body></html>';
 const blob=new Blob([content],{type:'text/html;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='collabzy-media-kit.html';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Creator media kit downloaded. Open it in a browser and print or save as PDF.');
}
async function exportAccountData(){try{const data=await api('/me/export'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='collabzy-account-export.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Account export downloaded.')}catch(e){toast(e.message)}}
async function deleteAccount(){if(prompt('This permanently deletes your Collabzy account and related profile/campaign data. Type DELETE to continue.')!=='DELETE')return;const password=prompt('Enter your current password to confirm account deletion.');if(!password)return;try{await api('/me',{method:'DELETE',body:JSON.stringify({password})});token='';me=null;safeStorageRemove('collabzy_token');mode='login';toast('Account deleted.');renderLanding()}catch(e){toast(e.message)}}
async function instagramConnect(){
 try{
  const native=window.CollabzyNative?.Capacitor?.isNativePlatform?.()===true;
  const status=await api('/instagram/status'),el=$('#igStatus');
  if(!status.connected){
   el.innerHTML='<span class="pill">'+esc(status.mode==='oauth-configured'?'Ready to connect':'Setup required')+'</span><p>'+esc(status.message||'')+'</p>';
   if(status.mode==='oauth-configured'){
    const d=await api('/instagram/connect'+(native?'?platform=native':''));
    if(d.authorization_url){
     if(native&&window.CollabzyNative?.Browser?.open)await window.CollabzyNative.Browser.open({url:d.authorization_url});
     else if(native)throw Error('Secure in-app browser is unavailable. Please reinstall the latest Collabzy APK.');
     else location.href=d.authorization_url;
    }
   }
   return;
  }
  el.innerHTML='<span class="pill green">Connected as @'+esc(status.handle||'connected')+'</span><p>Loading your official account insights and recent posts…</p>';
  const insightsPromise=api('/instagram/insights');
  const mediaPromise=api('/instagram/media').catch(e=>({media:[],mediaError:e.message}));
  const results=await Promise.all([insightsPromise,mediaPromise]),data=results[0],mediaData=results[1];
  const metrics=(data.insights||[]).map(x=>{const vals=(x.values||[]).map(v=>Number(v.value)||0),total=vals.reduce((a,b)=>a+b,0);return '<div class="stat"><strong>'+total.toLocaleString('en-IN')+'</strong><span>'+esc(x.title||x.name||x.id)+'</span></div>'}).join('');
  const posts=(mediaData.media||[]).map(p=>{
   const href=String(p.permalink||''),safeHref=/^https:\/\/(www\.)?instagram\.com\//i.test(href)?href:'#';
   const img=String(p.media_type==='VIDEO'?(p.thumbnail_url||''): (p.media_url||''));
   const safeImg=/^https:\/\//i.test(img)?img:'';
   return '<article class="card ig-post">'+(safeImg?'<img class="ig-thumb" src="'+esc(safeImg)+'" alt="Instagram post preview" loading="lazy">':'')+'<span class="pill">'+esc(p.media_type||'POST')+'</span><p>'+esc(String(p.caption||'No caption').slice(0,180))+'</p><div class="meta"><span>♥ '+Number(p.like_count||0).toLocaleString('en-IN')+'</span><span>Comments '+Number(p.comments_count||0).toLocaleString('en-IN')+'</span></div><a href="'+esc(safeHref)+'" target="_blank" rel="noopener noreferrer">View on Instagram ↗</a></article>';
  }).join('');
  el.innerHTML='<div class="cardtop"><span class="pill green">Officially connected</span><button class="btn alt" onclick="disconnectInstagram()">Disconnect</button></div><p>Account: @'+esc(data.handle||status.handle||'connected')+'</p><div class="stats">'+(metrics||'<div class="empty">Instagram returned no account metrics for this date range.</div>')+'</div><div class="eyebrow">RECENT CONTENT</div><div class="grid ig-media-grid">'+(posts||'<div class="empty">No recent media was returned. Check account type and Meta permissions.</div>')+'</div>'+(mediaData.mediaError?'<p class="note">Recent media could not be loaded: '+esc(mediaData.mediaError)+'</p>':'')+'<p class="note">Metrics and media are returned by Meta and depend on account eligibility and granted permissions.</p>';
 }catch(e){const el=$('#igStatus');if(el)el.innerHTML='<p>'+esc(e.message)+'</p>'}
}
async function disconnectInstagram(){try{await api('/instagram/disconnect',{method:'POST'});toast('Instagram disconnected and stored token removed.');$('#igStatus').innerHTML='<p>Instagram account disconnected.</p><button class="btn" onclick="instagramConnect()">Connect Instagram</button>'}catch(e){toast(e.message)}}
async function boot(){const params=new URLSearchParams(location.search);if(params.get('open')==='register'){mode='register';role=params.get('role')==='brand'?'brand':'creator';auth();return}if(!token){if(params.get('open')==='profile'||params.get('open')==='login'){mode='login';auth()}else renderLanding();return}if(params.get('open')==='profile')page='profile';renderLanding();try{const d=await api('/me');me=d.user;$('#signInBtn').classList.add('hidden');await Promise.all([loadCampaigns(),loadApps(),loadSaved(),loadDashboard(),loadConversations(),loadNotifications(),loadInvitations(),me.role==='brand'?Promise.all([loadMyCampaigns(),loadCreators()]):Promise.resolve()]);shell()}catch(e){token='';safeStorageRemove('collabzy_token');mode='login';auth();toast(e.message||'Please sign in again.')}}
boot();
window.addEventListener('collabzy:oauth-return',async event=>{
 try{
  const result=new URL(event.detail.url).searchParams.get('instagram')||'error';
  if(result==='connected'){
   const status=await api('/instagram/status');
   if(!status.connected)throw Error('Instagram callback returned, but the server did not confirm a connected account.');
   await Promise.all([loadDashboard(),loadNotifications()]);
   if(page==='instagram')await instagramConnect();
   toast('Instagram connected successfully.');
  }else toast(result==='denied'?'Instagram authorization was cancelled.':'Instagram connection failed. Check Meta app setup and permissions.');
 }catch(e){toast(e.message||'Instagram connection could not be verified.')}
});
const instagramResult=new URLSearchParams(location.search).get('instagram');if(instagramResult){history.replaceState({},'',location.pathname);setTimeout(()=>toast(instagramResult==='connected'?'Instagram connected successfully.':instagramResult==='denied'?'Instagram authorization was cancelled.':'Instagram connection failed. Check Meta app setup and permissions.'),900)}
const emailVerifiedResult=new URLSearchParams(location.search).get('verified');if(emailVerifiedResult){history.replaceState({},'',location.pathname);setTimeout(()=>toast(emailVerifiedResult==='1'?'Email verified. You can now sign in.':'Please sign in to continue.'),900)}
</script></body></html>
