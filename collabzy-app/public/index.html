:root{--ink:#211c35;--muted:#77748a;--purple:#7056e8;--line:#eeecf4;--bg:#f7f6fb;--white:#fff}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{background:#17132e;color:white;padding:22px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand b{color:#b6a6ff}.top small{color:#d4cfee}.wrap{max-width:1080px;margin:auto;padding:24px 18px 88px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:12px 0 22px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--purple)}h1{font-size:clamp(27px,5vw,42px);line-height:1.08;letter-spacing:-1.5px;margin:8px 0}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 6px}p{color:var(--muted);margin:5px 0}.btn{background:var(--purple);color:white;padding:11px 16px;border-radius:12px;font-weight:750}.btn.alt{background:#efebff;color:#5a43ca}.btn.dark{background:#211c35}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:17px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:750;color:#615c76}.field input,.field textarea,.field select,.toolbar input,.toolbar select{width:100%;border:1px solid #e3e0ed;background:#fff;border-radius:11px;padding:11px 12px;outline-color:var(--purple)}.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}.card{display:flex;flex-direction:column;gap:11px;min-height:245px}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#eee9ff;color:#6047d4;display:grid;place-items:center;font-weight:850}.pill{background:#f0edff;color:#5b47bd;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.pill.green{background:#e8f8ef;color:#20834e}.card h3{margin:0;font-size:17px}.card .desc{font-size:13px;flex:1}.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.panel{margin-top:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:white;border:1px solid var(--line);color:#6c6780;padding:9px 13px;border-radius:11px;font-weight:750}.nav button.active{background:#211c35;color:white}.auth{max-width:480px;margin:38px auto;background:white;border:1px solid var(--line);border-radius:22px;padding:25px}.auth h1{font-size:30px}.switch{display:flex;background:#f2f0f8;border-radius:12px;padding:4px}.switch button{flex:1;background:transparent;padding:9px;border-radius:9px;color:var(--muted)}.switch button.active{background:white;color:var(--ink);box-shadow:0 1px 5px #ddd9e7}.note{font-size:12px;background:#f6f3ff;padding:12px;border-radius:12px;color:#62558f}.empty{padding:32px 12px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#211c35;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0002;z-index:5;max-width:90vw}.actions{display:flex;gap:8px;flex-wrap:wrap}.foot{text-align:center;color:#9894a7;font-size:11px;padding:25px 0}.money{font-weight:850;color:#2d2550}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:17px 13px 60px}.top{padding:17px}.hero{align-items:flex-start;flex-direction:column}.card{padding:13px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.top small{display:none}.auth{margin:20px auto;padding:20px}.toolbar select{flex:1}}

25px;text-align:left;box-shadow:0 16px 50px #2119420b}.pricenum{font-size:42px;font-weight:900;letter-spacing:-2px;margin:14px 0}.pricenum small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}.pricecard ul{padding-left:20px;color:#615c76;line-height:2}.pricecard .btn{width:100%}.cta{background:#211942;color:white;padding:25px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.cta h2{margin:0;font-size:25px}.cta p{color:#d4cfee}.foot a{color:#77718f;text-decoration:none;margin:0 5px}

.modal{position:fixed;inset:0;background:#17132e99;backdrop-filter:blur(5px);display:grid;place-items:center;padding:16px;z-index:20}.modalcard{position:relative;width:min(560px,100%);max-height:90vh;overflow:auto;background:white;border-radius:22px;padding:25px;box-shadow:0 25px 90px #0003}.modalcard h2{margin:8px 0}.modalclose{position:absolute;right:17px;top:13px;background:#f1eef8;border-radius:50%;width:34px;height:34px;font-size:23px;color:#51476c}.modalcard .actions{margin-top:14px}
.chat-thread{display:flex;flex-direction:column;gap:10px;max-height:420px;min-height:180px;overflow:auto;padding:12px;background:#f8f7fc;border:1px solid var(--line);border-radius:14px;margin:12px 0}.chat-message{max-width:88%;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:white;align-self:flex-start;overflow-wrap:anywhere}.chat-message.mine{align-self:flex-end;background:#eee9ff;border-color:#d8ceff}.chat-message p{white-space:pre-wrap;margin:5px 0}.chat-message small{font-size:10px;opacity:.7}.chat-compose{display:flex;gap:9px;align-items:flex-end;margin-top:10px}.chat-compose textarea{flex:1;min-width:0;resize:vertical;border:1px solid #e3e0ed;border-radius:12px;padding:11px}.nav{flex-wrap:wrap}.nav button{white-space:nowrap}@media(max-width:720px){.grid[style*="grid-template-columns"]{grid-template-columns:1fr!important}.chat-compose{flex-direction:column;align-items:stretch}.chat-compose button{width:100%}}.ig-media-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.ig-post{min-width:0;overflow-wrap:anywhere}.ig-thumb{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;margin-bottom:12px}.ig-post a{color:var(--purple);font-weight:750;text-decoration:none}.note{background:#f5f2ff;border-radius:12px;padding:12px;font-size:12px}.danger-panel{border-color:#f0d4d4}.btn.danger{background:#a32836;color:#fff}</style></head><body><header class="top"><div class="brand">collab<b>zy</b> ✦</div><small>Creator partnerships. Real opportunities.</small><button id="accountBtn" class="btn alt hidden" onclick="logout()">Sign out</button></header><main id="root" class="wrap"><div class="empty">Loading Collabzy…</div></main><div id="toast" class="toast hidden"></div><script>
const API=(window.COLLABZY_API_BASE||((location.protocol==='capacitor:'||(location.hostname==='localhost'&&!location.port))?'https://collabzy-api.onrender.com/api':'/api')).replace(/\/$/,'');
let token=localStorage.getItem('collabzy_token')||'',me=null,role='creator',mode='login',campaigns=[],page='discover',apps=[],savedCampaigns=[],conversations=[],notifications=[],myCampaigns=[],creators=[],invitations=[],dashboard={},activeConversation=null,chatMessages=[];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed. Please try again.');return d}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function renderLanding(){
  $('#accountBtn').classList.add('hidden');
  $('#root').innerHTML='<section class="landing"><div class="hero"><div><div class="eyebrow">CREATORS × BRANDS × OPPORTUNITY</div><h1>Turn your creativity<br>into collaborations.</h1><p>One place to discover brand campaigns, pitch your ideas, and manage every collaboration from first hello to final deliverable.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Join as a creator →</button><button class="btn alt" onclick="mode=\'register\';role=\'brand\';auth()">I\'m a brand</button></div><p style="font-size:12px;margin-top:12px">Free to explore. No payment details required to create an account.</p></div><div class="heroart"><div class="artbadge">✦ Creator opportunities</div><div class="artmetric"><span>Campaign types</span><strong>Paid · Barter · Hybrid</strong></div><div class="artmetric"><span>Built for both sides</span><strong>Creators + Brands</strong></div><div class="artshine">collab<span>zy</span></div></div></div><div class="landingstats"><div><strong>Discover</strong><span>Find campaigns that fit your niche</span></div><div><strong>Pitch</strong><span>Apply with your own proposal</span></div><div><strong>Manage</strong><span>Track every application status</span></div></div><section class="landingsection"><div class="eyebrow">HOW IT WORKS</div><h2>Good partnerships start here.</h2><div class="grid"><article class="card feature"><div class="avatar">01</div><h3>Discover opportunities</h3><p class="desc">Explore brand campaigns by category, collaboration type and budget.</p></article><article class="card feature"><div class="avatar">02</div><h3>Make your pitch</h3><p class="desc">Share your idea and proposed rate directly with the brand.</p></article><article class="card feature"><div class="avatar">03</div><h3>Build relationships</h3><p class="desc">Brands review applicants and manage acceptance from one workspace.</p></article></div></section><section class="landingsection campaignslanding"><div class="eyebrow">REAL OPPORTUNITIES</div><h2>Explore the marketplace</h2><p>Browse opportunities now. Create an account to apply or publish a campaign.</p><div id="publicCampaigns" class="grid"><div class="empty">Loading campaigns…</div></div></section><section class="pricing"><div class="eyebrow">SIMPLE, CREATOR-FRIENDLY PRICING</div><h2>More collaborations. Less friction.</h2><p>Our planned creator membership is ₹299 per year.</p><div class="pricecard"><span class="pill">PLANNED PLAN</span><div class="pricenum">₹299 <small>/ year</small></div><ul><li>Creator campaign discovery</li><li>Application status tracking</li><li>Creator profile and niche</li><li>Instagram insights when Meta access is configured</li></ul><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Create your free account</button><p style="font-size:11px">Paid membership checkout is not live yet; no payment will be collected.</p></div></section><section class="cta"><div><h2>Your next collaboration could start today.</h2><p>Join Collabzy and take the next step in your creator journey.</p></div><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Get started →</button></section><div class="foot">© 2026 Collabzy · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="mailto:support@collabzy.app">Contact</a><br>Instagram features depend on official Meta permissions. Campaign examples may be illustrative.</div></section>';
  api('/campaigns').then(d=>{const el=$('#publicCampaigns');if(!el)return;const cs=(d.campaigns||[]).slice(0,3);el.innerHTML=cs.length?cs.map(c=>'<article class="card"><div class="cardtop"><div class="avatar">'+esc((c.brand_name||'B').slice(0,1).toUpperCase())+'</div><span class="pill '+(c.collaboration_type==='Paid'?'green':'')+'">'+esc(c.collaboration_type)+'</span></div><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.brand_name)+' · '+esc(c.category)+'</p></div><div class="desc">'+esc(c.description)+'</div><div class="meta"><span>📍 '+esc(c.location||'India')+'</span><span class="money">'+money(c.budget_min,c.budget_max)+'</span></div><button class="btn alt" onclick="mode=\'register\';role=\'creator\';auth()">Join to apply</button></article>').join(''):'<div class="empty">Campaigns will appear here as brands join.</div>'}).catch(()=>{const el=$('#publicCampaigns');if(el)el.innerHTML='<div class="empty">Marketplace is waking up. Please check back shortly.</div>'});
}
function auth(){ $('#accountBtn').classList.add('hidden');$('#root').innerHTML=`<section class="auth"><div class="eyebrow">THE CREATOR ECONOMY, CONNECTED</div><h1>${mode==='login'?'Welcome back.':'Join Collabzy.'}</h1><p>${mode==='login'?'Find your next great brand collaboration.':'Create a creator or brand account in minutes.'}</p><div class="switch"><button class="${role==='creator'?'active':''}" onclick="setRole('creator')">I'm a creator</button><button class="${role==='brand'?'active':''}" onclick="setRole('brand')">I'm a brand</button></div><form id="authForm">${mode==='register'?'<div class="field"><label>Name / brand name</label><input name="name" required maxlength="80" placeholder="Your name"></div>':''}<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="At least 8 characters"></div><button class="btn" style="width:100%;margin-top:7px">${mode==='login'?'Sign in →':'Create account →'}</button></form><p style="text-align:center;margin-top:18px">${mode==='login'?'New here?':'Already have an account?'} <button class="btn alt" onclick="mode='${mode==='login'?'register':'login'}';auth()">${mode==='login'?'Create account':'Sign in'}</button></p><div class="note">Instagram insights require official Meta authorization. Payments are not enabled in this build.</div></section>`;$('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify({name:f.get('name'),email:f.get('email'),password:f.get('password'),role})});token=d.token;me=d.user;localStorage.setItem('collabzy_token',token);await boot()}catch(err){toast(err.message)}}}
function setRole(r){role=r;auth()}
function logout(){token='';me=null;localStorage.removeItem('collabzy_token');mode='login';auth()}
function money(a,b){return a&&b?'₹'+Number(a).toLocaleString('en-IN')+'–₹'+Number(b).toLocaleString('en-IN'):a?'From ₹'+Number(a).toLocaleString('en-IN'):b?'Up to ₹'+Number(b).toLocaleString('en-IN'):'Barter / negotiable'}
function card(c){const saved=savedCampaigns.some(x=>Number(x.id)===Number(c.id));return `<article class="card"><div class="cardtop"><div class="avatar">${esc((c.brand_name||'B').slice(0,1).toUpperCase())}</div><span class="pill ${c.collaboration_type==='Paid'?'green':''}">${esc(c.collaboration_type)}</span></div><div><h3>${esc(c.title)}</h3><p>${esc(c.brand_name)} · ${esc(c.category)}</p></div><div class="desc">${esc(c.description)}</div><div class="meta"><span>📍 ${esc(c.location||'India')}</span><span class="money">${money(c.budget_min,c.budget_max)}</span></div><div class="meta"><span>Deliverables</span><b>${esc(c.deliverables||'Discuss with brand')}</b></div><div class="actions"><button class="btn" onclick="applyCampaign(${c.id})">${me.role==='creator'?'Apply to campaign':'View campaign'}</button><button class="btn alt" onclick="toggleSaved(${c.id})">${saved?'★ Saved':'☆ Save'}</button></div></article>`}
async function loadCampaigns(){const d=await api('/campaigns');campaigns=d.campaigns||[]}
async function loadSaved(){try{savedCampaigns=(await api('/saved-campaigns')).campaigns||[]}catch{savedCampaigns=[]}}
async function loadDashboard(){try{dashboard=(await api('/dashboard')).stats||{}}catch{dashboard={}}}
async function loadConversations(){try{conversations=(await api('/conversations')).conversations||[]}catch{conversations=[]}}
async function loadNotifications(){try{notifications=(await api('/notifications')).notifications||[]}catch{notifications=[]}}
async function loadMyCampaigns(){try{myCampaigns=(await api('/my-campaigns')).campaigns||[]}catch{myCampaigns=[]}}
async function loadCreators(filters={}){try{const params=new URLSearchParams(Object.entries(filters).filter(([k,v])=>String(v||'').trim()));creators=(await api('/creators'+(params.toString()?'?'+params:''))).creators||[]}catch(e){creators=[];toast(e.message)}}
async function searchCreators(){const q=$('#creatorQ')?.value||'',niche=$('#creatorNiche')?.value||'',location=$('#creatorLocation')?.value||'';await loadCreators({q,niche,location});renderPage()}
async function loadInvitations(){try{invitations=(await api('/invitations')).invitations||[]}catch{invitations=[]}}
async function respondInvitation(id,status){try{await api('/invitations/'+id+'/respond',{method:'PATCH',body:JSON.stringify({status})});await Promise.all([loadInvitations(),loadApps(),loadConversations(),loadNotifications(),loadDashboard()]);renderPage();toast(status==='accepted'?'Invitation accepted. A conversation is ready.':'Invitation declined.')}catch(e){toast(e.message)}}
function inviteCreator(id){const active=myCampaigns.filter(c=>c.status==='active');if(!active.length){toast('Publish an active campaign first, then invite creators.');return}document.querySelector('#inviteModal')?.remove();document.body.insertAdjacentHTML('beforeend','<div id="inviteModal" class="modal"><section class="modalcard"><button class="modalclose" onclick="document.querySelector(\'#inviteModal\')?.remove()" aria-label="Close">×</button><div class="eyebrow">CREATOR OUTREACH</div><h2>Invite to a campaign</h2><form id="inviteForm"><div class="field"><label>Your active campaign</label><select name="campaign_id" required>'+active.map(c=>'<option value="'+c.id+'">'+esc(c.title)+'</option>').join('')+'</select></div><div class="field"><label>Personal message</label><textarea name="message" rows="4" maxlength="1000" placeholder="Tell the creator why they are a good fit for this collaboration."></textarea></div><div class="actions"><button class="btn" type="submit">Send invitation</button><button class="btn alt" type="button" onclick="document.querySelector(\'#inviteModal\')?.remove()">Cancel</button></div></form></section></div>');const modal=$('#inviteModal');$('#inviteForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),campaignId=Number(f.get('campaign_id')),button=e.target.querySelector('button[type=submit]');button.disabled=true;try{await api('/campaigns/'+campaignId+'/invite',{method:'POST',body:JSON.stringify({creator_id:id,message:f.get('message')})});modal.remove();await Promise.all([loadInvitations(),loadNotifications(),loadDashboard()]);toast('Invitation sent to creator.')}catch(err){toast(err.message);button.disabled=false}}}

async function openConversation(id){activeConversation=Number(id);try{chatMessages=(await api('/conversations/'+activeConversation+'/messages')).messages||[];await Promise.all([loadConversations(),loadDashboard()]);page='messages';shell()}catch(e){toast(e.message)}}
async function sendMessage(e){e.preventDefault();const form=e.target,field=form.elements.body,body=field.value.trim();if(!body)return;const button=form.querySelector('button[type=submit]');button.disabled=true;try{await api('/conversations/'+activeConversation+'/messages',{method:'POST',body:JSON.stringify({body})});field.value='';chatMessages=(await api('/conversations/'+activeConversation+'/messages')).messages||[];await Promise.all([loadConversations(),loadDashboard()]);shell()}catch(err){toast(err.message)}finally{if(button)button.disabled=false}}
async function markNotificationsRead(){try{await api('/notifications/read-all',{method:'PATCH'});await loadNotifications();await loadDashboard();shell();toast('Notifications marked as read.')}catch(e){toast(e.message)}}
async function toggleCampaignStatus(id,status){try{await api('/campaigns/'+id+'/manage',{method:'PATCH',body:JSON.stringify({status})});await Promise.all([loadMyCampaigns(),loadCampaigns(),loadDashboard()]);renderPage();toast(status==='closed'?'Campaign closed.':'Campaign is live again.')}catch(e){toast(e.message)}}
async function toggleSaved(id){const saved=savedCampaigns.some(x=>Number(x.id)===Number(id));try{await api('/campaigns/'+id+'/save',{method:saved?'DELETE':'POST'});await loadSaved();if(page==='saved')renderPage();else renderPage();toast(saved?'Removed from saved campaigns.':'Campaign saved for later.')}catch(e){toast(e.message)}}
function shell(){ $('#accountBtn').classList.remove('hidden');$('#root').innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR NEXT COLLAB STARTS HERE</div><h1>Make your influence<br>work for you.</h1><p>Discover paid campaigns, barter deals and long-term brand partnerships.</p></div><div class="actions">${me.role==='brand'?'<button class="btn" onclick="newCampaign()">＋ Post a campaign</button>':''}<button class="btn alt" onclick="go('profile')">My profile</button></div></div><div class="stats">${me.role==='brand'?'<div class="stat"><strong>'+Number(dashboard.myCampaigns||0)+'</strong><span>My campaigns</span></div><div class="stat"><strong>'+Number(dashboard.receivedApplications||0)+'</strong><span>Creator applications</span></div><div class="stat"><strong>'+Number(dashboard.unreadMessages||0)+'</strong><span>Unread messages</span></div>':'<div class="stat"><strong>'+Number(dashboard.activeCampaigns||campaigns.length)+'</strong><span>Active campaigns</span></div><div class="stat"><strong>'+Number(dashboard.myApplications||apps.length)+'</strong><span>My applications</span></div><div class="stat"><strong>'+Number(dashboard.accepted||apps.filter(a=>a.status==='accepted').length)+'</strong><span>Accepted</span></div>'}</div><nav class="nav"><button class="${page==='discover'?'active':''}" onclick="go('discover')">Discover</button>${me.role==='brand'?'<button class="'+(page==='mycampaigns'?'active':'')+'" onclick="go(\'mycampaigns\')">My campaigns</button>':''}${me.role==='brand'?'<button class="'+(page==='creators'?'active':'')+'" onclick="go(\'creators\')">Find creators</button>':''}<button class="${page==='applications'?'active':''}" onclick="go('applications')">Applications</button><button class="${page==='invitations'?'active':''}" onclick="go('invitations')">Invitations</button><button class="${page==='saved'?'active':''}" onclick="go('saved')">Saved</button><button class="${page==='messages'?'active':''}" onclick="go('messages')">Messages ${Number(dashboard.unreadMessages||0)?'('+Number(dashboard.unreadMessages||0)+')':''}</button><button class="${page==='notifications'?'active':''}" onclick="go('notifications')">Alerts ${Number(dashboard.unreadNotifications||0)?'('+Number(dashboard.unreadNotifications||0)+')':''}</button><button class="${page==='instagram'?'active':''}" onclick="go('instagram')">Instagram</button><button class="${page==='profile'?'active':''}" onclick="go('profile')">Profile</button></nav><section id="view"></section><div class="foot">Collabzy · Built for creators and brands · Be genuine. Create impact.</div>`;renderPage()}

function renderPage(){const v=$('#view');if(!v)return;if(page==='discover'){v.innerHTML=`<h2>Campaign marketplace</h2><p>Find opportunities that fit your niche.</p><div class="toolbar"><input id="q" placeholder="Search campaigns or brands…"><select id="type"><option>All</option><option>Paid</option><option>Barter</option><option>Hybrid</option></select><button class="btn" onclick="filter()">Search</button></div><div id="campaignGrid" class="grid">${campaigns.length?campaigns.map(card).join(''):'<div class="empty">No campaigns yet. Brands can publish the first opportunity.</div>'}</div>`;return}
if(page==='creators'){v.innerHTML='<h2>Find creators</h2><p>Discover talent by niche, location and creator profile. Instagram-linked profiles are marked when authorized.</p><div class="toolbar"><input id="creatorQ" placeholder="Search name, niche or bio…" style="flex:2"><input id="creatorNiche" placeholder="Niche" style="flex:1"><input id="creatorLocation" placeholder="Location" style="flex:1"><button class="btn" onclick="searchCreators()">Search</button></div><div class="grid">'+(creators.length?creators.map(c=>'<article class="card"><div class="cardtop"><div class="avatar">'+esc((c.name||'C').slice(0,1).toUpperCase())+'</div><span class="pill '+(Number(c.instagram_connected)?'green':'')+'">'+(Number(c.instagram_connected)?'Instagram linked':'Profile')+'</span></div><h3>'+esc(c.name)+'</h3><p>'+esc(c.niche||'Creator')+' · '+esc(c.location||'Location not set')+'</p><div class="stats" style="grid-template-columns:repeat(2,1fr);margin:12px 0"><div class="stat"><strong>'+Number(c.followers||0).toLocaleString('en-IN')+'</strong><span>Followers</span></div><div class="stat"><strong>'+Number(c.engagement||0).toLocaleString('en-IN')+'%</strong><span>Engagement (profile)</span></div></div><div class="desc">'+esc(c.bio||'This creator has not added a bio yet.')+'</div>'+(c.instagram_handle?'<p>Instagram: @'+esc(c.instagram_handle)+'</p>':'')+'<button class="btn" onclick="inviteCreator('+c.id+')">Invite to campaign</button></article>').join(''):'<div class="empty">No creator profiles match this search yet. Try another niche or location.</div>')+'</div>';return}
if(page==='invitations'){v.innerHTML='<div class="panel"><div class="eyebrow">PARTNERSHIP INVITATIONS</div><h2>'+(me.role==='creator'?'Brand invitations':'Invitations sent')+'</h2><p>'+(me.role==='creator'?'Review invitations from brands and accept the collaborations that fit.':'Track the invitations you have sent to creators.')+'</p>'+(invitations.length?invitations.map(i=>'<article class="card" style="margin:12px 0"><div class="cardtop"><span class="pill '+(i.status==='pending'?'':'green')+'">'+esc(i.status)+'</span><span class="pill">'+esc(i.collaboration_type||'Collaboration')+'</span></div><h3>'+esc(i.campaign_title||'Campaign')+'</h3><p>'+(me.role==='creator'?'From '+esc(i.brand_name||'Brand'):'To '+esc(i.creator_name||'Creator')+(i.niche?' · '+esc(i.niche):''))+' · '+esc(i.category||'')+'</p><div class="money">'+money(i.budget_min,i.budget_max)+'</div><p>'+esc(i.message||'No message added.')+'</p>'+(me.role==='creator'&&i.status==='pending'?'<div class="actions"><button class="btn" onclick="respondInvitation('+i.id+',\'accepted\')">Accept invitation</button><button class="btn alt" onclick="respondInvitation('+i.id+',\'declined\')">Decline</button></div>':'')+'</article>').join(''):'<div class="empty">No invitations yet. Brands can send invitations from Find creators.</div>')+'</div>';return}
if(page==='mycampaigns'){v.innerHTML='<h2>My campaigns</h2><p>Manage your brand briefs, see applications and pause listings when you are done.</p><div class="grid">'+(myCampaigns.length?myCampaigns.map(c=>'<article class="card"><div class="cardtop"><span class="pill '+(c.status==='active'?'green':'')+'">'+esc(c.status)+'</span><span class="pill">'+Number(c.application_count||0)+' applications</span></div><h3>'+esc(c.title)+'</h3><p>'+esc(c.category)+' · '+esc(c.collaboration_type)+'</p><div class="money">'+money(c.budget_min,c.budget_max)+'</div><div class="actions"><button class="btn" onclick="go(\'applications\')">Review applicants</button><button class="btn alt" onclick="toggleCampaignStatus('+c.id+',\''+(c.status==='active'?'closed':'active')+'\')">'+(c.status==='active'?'Close campaign':'Reopen')+'</button></div></article>').join(''):'<div class="empty">No campaigns yet. Publish your first campaign to start finding creators.</div>')+'</div>';return}
if(page==='messages'){const selected=conversations.find(c=>Number(c.id)===Number(activeConversation));v.innerHTML='<div class="panel"><div class="eyebrow">COLLABZY INBOX</div><h2>Messages</h2><p>Coordinate deliverables and campaign details directly with your collaboration partner.</p><div class="grid" style="grid-template-columns:minmax(0,0.85fr) minmax(0,1.5fr);margin-top:16px"><div><h3>Conversations</h3>'+(conversations.length?conversations.map(c=>'<button class="card" style="text-align:left;width:100%;margin:8px 0;'+(Number(c.id)===Number(activeConversation)?'border-color:var(--purple);':'')+'" onclick="openConversation('+c.id+')"><b>'+esc(c.counterpart_name||'Collab partner')+'</b><p>'+esc(c.campaign_title||'Campaign')+'</p><p>'+esc(c.last_message||'No messages yet')+'</p>'+(Number(c.unread||0)?'<span class="pill green">'+Number(c.unread)+' new</span>':'')+'</button>').join(''):'<div class="empty">Your campaign conversations will appear here after a creator applies.</div>')+'</div><div><h3>'+(selected?esc(selected.counterpart_name||'Conversation partner'):'Choose a conversation')+'</h3>'+(selected?'<p>'+esc(selected.campaign_title||'Campaign')+' · application '+esc(selected.application_status||'pending')+'</p><div class="chat-thread">'+(chatMessages.length?chatMessages.map(m=>'<div class="chat-message '+(Number(m.sender_id)===Number(me.id)?'mine':'')+'"><b>'+esc(m.sender_name||'Member')+'</b><p style="color:inherit">'+esc(m.body)+'</p><small>'+esc(m.created_at||'')+'</small></div>').join(''):'<div class="empty">Say hello to start coordinating your collaboration.</div>')+'</div><form class="chat-compose" onsubmit="sendMessage(event)"><textarea name="body" maxlength="2000" rows="2" required placeholder="Write a message…"></textarea><button class="btn" type="submit">Send message</button></form>':'<div class="empty">Select a conversation on the left to read and reply.</div>')+'</div></div></div>';return}
if(page==='notifications'){v.innerHTML='<div class="panel"><div class="eyebrow">ACTIVITY CENTER</div><div class="actions" style="justify-content:space-between"><h2>Notifications</h2><button class="btn alt" onclick="markNotificationsRead()">Mark all read</button></div><p>Campaign applications and collaboration messages, all in one place.</p>'+(notifications.length?notifications.map(n=>'<article class="card" style="margin:10px 0;'+(!n.read_at?'border-color:#c9befb;':'')+'"><div class="cardtop"><b>'+esc(n.title)+'</b><span class="pill">'+esc(n.kind)+'</span></div><p>'+esc(n.body)+'</p><small>'+esc(n.created_at||'')+'</small></article>').join(''):'<div class="empty">You are all caught up. New applications and messages will appear here.</div>')+'</div>';return}
if(page==='saved'){v.innerHTML='<h2>Saved campaigns</h2><p>Keep promising opportunities in one place and come back when you are ready.</p><div class="grid">'+(savedCampaigns.length?savedCampaigns.map(card).join(''):'<div class="empty">No saved campaigns yet. Save a campaign from Discover to build your shortlist.</div>')+'</div>';return}
if(page==='applications'){v.innerHTML='<h2>Application tracker</h2><p>Follow every pitch from submitted to accepted.</p><div class="panel" id="appList">Loading…</div>';loadApps().then(()=>{if(page!=='applications')return;$('#appList').innerHTML=apps.length?apps.map(a=>`<div style="padding:13px 0;border-bottom:1px solid var(--line)"><b>${esc(a.campaign_title||'Campaign')}</b><p>${esc(a.brand_name||a.creator_name||'Collab')} · <span class="pill">${esc(a.status)}</span></p>${me.role==='brand'&&a.status==='pending'?'<div class="actions"><button class="btn" onclick="updateApp('+a.id+',\'accepted\')">Accept</button><button class="btn alt" onclick="updateApp('+a.id+',\'declined\')">Decline</button></div>':''}</div>`).join(''):'<div class="empty">No applications yet.</div>'});return}
if(page==='instagram'){v.innerHTML='<div class="panel"><div class="eyebrow">OFFICIAL ACCOUNT CONNECTION</div><h2>Connect Instagram</h2><p>Use Meta-authorized account access to retrieve insights that your account and permissions allow.</p><div class="note" style="margin:16px 0">Connect using the official Meta authorization flow. The host must have Meta app credentials and an approved callback configured. We never scrape private follower data.</div><button class="btn" onclick="instagramConnect()">Connect / refresh Instagram</button><div id="igStatus" style="margin-top:15px"></div></div>';return}
if(page==='profile'){v.innerHTML=`<div class="panel"><h2>Your creator / brand profile</h2><p>Keep your details current so partnerships can find you.</p><form id="profileForm"><div class="field"><label>Name</label><input name="name" required value="${esc(me.name)}"></div><div class="field"><label>Niche</label><input name="niche" value="${esc(me.niche||'')}" placeholder="Beauty, food, fitness…"></div><div class="field"><label>Location</label><input name="location" value="${esc(me.location||'')}" placeholder="City, country"></div><div class="field"><label>Instagram handle (without @)</label><input name="instagram_handle" value="${esc(me.instagram_handle||'')}" placeholder="yourhandle"></div><div class="grid"><div class="field"><label>Follower count (profile metric)</label><input name="followers" type="number" min="0" max="100000000" value="${Number(me.followers||0)}"></div><div class="field"><label>Engagement rate (%)</label><input name="engagement" type="number" min="0" max="100" step="0.1" value="${Number(me.engagement||0)}"></div></div><p>Profile metrics are self-reported unless synced by an authorized Instagram connection.</p><div class="field"><label>Bio</label><textarea name="bio" rows="3" maxlength="500">${esc(me.bio||'')}</textarea></div><button class="btn">Save profile</button></form></div><div class="panel" style="margin-top:14px"><h2>Account security & privacy</h2><p>Change your password or download a copy of the information associated with your account.</p><form id="passwordForm"><div class="field"><label>Current password</label><input name="current_password" type="password" required autocomplete="current-password"></div><div class="field"><label>New password (8+ characters)</label><input name="new_password" type="password" minlength="8" required autocomplete="new-password"></div><button class="btn">Change password</button></form><div class="actions" style="margin-top:14px"><button class="btn alt" onclick="exportAccountData()">Download my data</button><button class="btn alt" onclick="logout()">Sign out</button></div></div><div class="panel danger-panel" style="margin-top:14px"><h2>Delete account</h2><p>This permanently removes your account and its associated campaigns, applications, conversations and notifications. This cannot be undone.</p><button class="btn danger" onclick="deleteAccount()">Delete my account</button></div>`;$('#profileForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{me=(await api('/me',{method:'PATCH',body:JSON.stringify(d)})).user;toast('Profile saved');shell()}catch(err){toast(err.message)}};$('#passwordForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{await api('/me/password',{method:'PATCH',body:JSON.stringify(d)});e.target.reset();toast('Password updated.')}catch(err){toast(err.message)}}}}
function filter(){const q=($('#q').value||'').toLowerCase(),t=$('#type').value;const list=campaigns.filter(c=>(!q||[c.title,c.brand_name,c.description,c.category].join(' ').toLowerCase().includes(q))&&(t==='All'||c.collaboration_type===t));$('#campaignGrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching campaigns. Try another search.</div>'}
async function loadApps(){try{apps=(await api('/applications')).applications||[]}catch{apps=[]}}
async function applyCampaign(id){
 if(me.role!=='creator'){const c=campaigns.find(x=>Number(x.id)===Number(id));toast(c?'Campaign: '+c.title+' · Use Post a campaign to publish your own.':'Brand workspace');return}
 const c=campaigns.find(x=>Number(x.id)===Number(id));if(!c){toast('Campaign not found. Refresh and try again.');return}
 document.querySelector('#applicationModal')?.remove();
 document.body.insertAdjacentHTML('beforeend','<div id="applicationModal" class="modal"><section class="modalcard"><button id="closeApply" class="modalclose" aria-label="Close">×</button><div class="eyebrow">CAMPAIGN APPLICATION</div><h2>'+esc(c.title)+'</h2><p>'+esc(c.brand_name)+' · '+esc(c.category)+' · '+esc(c.collaboration_type)+'</p><form id="applyForm"><div class="field"><label>Your pitch</label><textarea name="pitch" rows="4" maxlength="1000" required placeholder="Explain why you are a great fit for this collaboration."></textarea></div><div class="field"><label>Your proposed rate (INR)</label><input name="proposed_rate" type="number" min="0" max="100000000" value="'+(c.collaboration_type==='Barter'?'0':String(c.budget_min||0))+'" required></div><div class="actions"><button class="btn" type="submit">Send application</button><button class="btn alt" type="button" id="cancelApply">Cancel</button></div></form></section></div>');
 const close=()=>document.querySelector('#applicationModal')?.remove();$('#closeApply').onclick=close;$('#cancelApply').onclick=close;$('#applicationModal').onclick=e=>{if(e.target.id==='applicationModal')close()};
 $('#applyForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const button=e.target.querySelector('button[type=submit]');button.disabled=true;button.textContent='Sending…';try{await api('/campaigns/'+id+'/apply',{method:'POST',body:JSON.stringify({pitch:f.get('pitch'),proposed_rate:Number(f.get('proposed_rate'))||0})});close();toast('Application sent!');await Promise.all([loadApps(),loadDashboard(),loadNotifications(),loadConversations()]);shell()}catch(err){button.disabled=false;button.textContent='Send application';toast(err.message)}};
}
async function updateApp(id,status){try{await api('/applications/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await loadApps();renderPage();toast('Application updated')}catch(e){toast(e.message)}}
function newCampaign(){
 if(me.role!=='brand'){toast('Only brand accounts can publish campaigns.');return}
 const v=$('#view');v.innerHTML='<div class="panel"><div class="eyebrow">BRAND WORKSPACE</div><h2>Publish a campaign</h2><p>Share a clear brief so creators know exactly what you need.</p><form id="campaignForm"><div class="field"><label>Campaign title</label><input name="title" required maxlength="120" placeholder="e.g. Summer product launch"></div><div class="field"><label>Category</label><select name="category" required><option value="">Choose category</option><option>Beauty</option><option>Fashion</option><option>Food</option><option>Fitness</option><option>Travel</option><option>Technology</option><option>Lifestyle</option><option>Gaming</option><option>Finance</option><option>Other</option></select></div><div class="field"><label>Collaboration type</label><select name="collaboration_type" required><option value="Paid">Paid</option><option value="Barter">Barter</option><option value="Hybrid">Hybrid</option></select></div><div class="field"><label>Campaign brief</label><textarea name="description" required rows="4" maxlength="1500" placeholder="Product, audience, key message, timeline and what creators should deliver."></textarea></div><div class="grid"><div class="field"><label>Minimum budget (₹)</label><input name="budget_min" type="number" min="0" max="100000000" value="3000" required></div><div class="field"><label>Maximum budget (₹)</label><input name="budget_max" type="number" min="0" max="100000000" value="10000" required></div></div><div class="field"><label>Deliverables</label><input name="deliverables" maxlength="300" placeholder="1 Reel + 3 Stories"></div><div class="field"><label>Location</label><input name="location" maxlength="100" value="India" placeholder="India / remote"></div><div class="actions"><button class="btn" type="submit">Publish campaign</button><button class="btn alt" type="button" id="cancelCampaign">Cancel</button></div></form></div>';
 $('#cancelCampaign').onclick=()=>go('discover');
 $('#campaignForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));const low=Math.max(0,Number(b.budget_min)||0),high=Math.max(0,Number(b.budget_max)||0);if(high<low){toast('Maximum budget must be at least the minimum budget.');return}const button=e.target.querySelector('button[type=submit]');button.disabled=true;button.textContent='Publishing…';try{await api('/campaigns',{method:'POST',body:JSON.stringify({...b,budget_min:low,budget_max:high})});toast('Campaign published');await Promise.all([loadCampaigns(),loadMyCampaigns(),loadDashboard()]);shell()}catch(err){button.disabled=false;button.textContent='Publish campaign';toast(err.message)}};
}
async function exportAccountData(){try{const data=await api('/me/export'),blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='collabzy-account-export.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Account export downloaded.')}catch(e){toast(e.message)}}
async function deleteAccount(){if(prompt('This permanently deletes your Collabzy account and related profile/campaign data. Type DELETE to continue.')!=='DELETE')return;const password=prompt('Enter your current password to confirm account deletion.');if(!password)return;try{await api('/me',{method:'DELETE',body:JSON.stringify({password})});token='';me=null;localStorage.removeItem('collabzy_token');mode='login';toast('Account deleted.');renderLanding()}catch(e){toast(e.message)}}
async function instagramConnect(){
 try{
  const status=await api('/instagram/status'),el=$('#igStatus');
  if(!status.connected){
   el.innerHTML='<span class="pill">'+esc(status.mode==='oauth-configured'?'Ready to connect':'Setup required')+'</span><p>'+esc(status.message||'')+'</p>';
   if(status.mode==='oauth-configured'){
    const d=await api('/instagram/connect');
    if(d.authorization_url)location.href=d.authorization_url;
   }
   return;
  }
  el.innerHTML='<span class="pill green">Connected as @'+esc(status.handle||'connected')+'</span><p>Loading your official account insights and recent posts…</p>';
  const insightsPromise=api('/instagram/insights');
  const mediaPromise=api('/instagram/media').catch(e=>({media:[],mediaError:e.message}));
  const results=await Promise.all([insightsPromise,mediaPromise]),data=results[0],mediaData=results[1];
  const metrics=(data.insights||[]).map(x=>{const vals=(x.values||[]).map(v=>Number(v.value)||0),total=vals.reduce((a,b)=>a+b,0);return '<div class="stat"><strong>'+total.toLocaleString('en-IN')+'</strong><span>'+esc(x.title||x.name||x.id)+'</span></div>'}).join('');
  const posts=(mediaData.media||[]).map(p=>{
   const href=String(p.permalink||''),safeHref=/^https:\/\/(www\.)?instagram\.com\//i.test(href)?href:'#';
   const img=String(p.media_type==='VIDEO'?(p.thumbnail_url||''): (p.media_url||''));
   const safeImg=/^https:\/\//i.test(img)?img:'';
   return '<article class="card ig-post">'+(safeImg?'<img class="ig-thumb" src="'+esc(safeImg)+'" alt="Instagram post preview" loading="lazy">':'')+'<span class="pill">'+esc(p.media_type||'POST')+'</span><p>'+esc(String(p.caption||'No caption').slice(0,180))+'</p><div class="meta"><span>♥ '+Number(p.like_count||0).toLocaleString('en-IN')+'</span><span>Comments '+Number(p.comments_count||0).toLocaleString('en-IN')+'</span></div><a href="'+esc(safeHref)+'" target="_blank" rel="noopener noreferrer">View on Instagram ↗</a></article>';
  }).join('');
  el.innerHTML='<div class="cardtop"><span class="pill green">Officially connected</span><button class="btn alt" onclick="disconnectInstagram()">Disconnect</button></div><p>Account: @'+esc(data.handle||status.handle||'connected')+'</p><div class="stats">'+(metrics||'<div class="empty">Instagram returned no account metrics for this date range.</div>')+'</div><div class="eyebrow">RECENT CONTENT</div><div class="grid ig-media-grid">'+(posts||'<div class="empty">No recent media was returned. Check account type and Meta permissions.</div>')+'</div>'+(mediaData.mediaError?'<p class="note">Recent media could not be loaded: '+esc(mediaData.mediaError)+'</p>':'')+'<p class="note">Metrics and media are returned by Meta and depend on account eligibility and granted permissions.</p>';
 }catch(e){const el=$('#igStatus');if(el)el.innerHTML='<p>'+esc(e.message)+'</p>'}
}
async function disconnectInstagram(){try{await api('/instagram/disconnect',{method:'POST'});toast('Instagram disconnected and stored token removed.');$('#igStatus').innerHTML='<p>Instagram account disconnected.</p><button class="btn" onclick="instagramConnect()">Connect Instagram</button>'}catch(e){toast(e.message)}}
async function boot(){try{if(!token){renderLanding();return}const d=await api('/me');me=d.user;await Promise.all([loadCampaigns(),loadApps(),loadSaved(),loadDashboard(),loadConversations(),loadNotifications(),loadInvitations(),me.role==='brand'?Promise.all([loadMyCampaigns(),loadCreators()]):Promise.resolve()]);shell()}catch(e){token='';localStorage.removeItem('collabzy_token');auth();toast('Please sign in again.')}}
boot();const instagramResult=new URLSearchParams(location.search).get('instagram');if(instagramResult){history.replaceState({},'',location.pathname);setTimeout(()=>toast(instagramResult==='connected'?'Instagram connected successfully.':instagramResult==='denied'?'Instagram authorization was cancelled.':'Instagram connection failed. Check Meta app setup and permissions.'),900)}
</script></body></html>
