<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17132e"><title>Collabzy</title><style>
:root{--ink:#211c35;--muted:#77748a;--purple:#7056e8;--line:#eeecf4;--bg:#f7f6fb;--white:#fff}*{box-sizing:border-box}body{margin:0;font:15px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.top{background:#17132e;color:white;padding:22px max(20px,calc((100vw - 1080px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:850;letter-spacing:-1px}.brand b{color:#b6a6ff}.top small{color:#d4cfee}.wrap{max-width:1080px;margin:auto;padding:24px 18px 88px}.hero{display:flex;justify-content:space-between;align-items:center;gap:18px;margin:12px 0 22px}.eyebrow{font-size:11px;letter-spacing:1.5px;font-weight:800;color:var(--purple)}h1{font-size:clamp(27px,5vw,42px);line-height:1.08;letter-spacing:-1.5px;margin:8px 0}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 6px}p{color:var(--muted);margin:5px 0}.btn{background:var(--purple);color:white;padding:11px 16px;border-radius:12px;font-weight:750}.btn.alt{background:#efebff;color:#5a43ca}.btn.dark{background:#211c35}.btn:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.stat,.card,.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:17px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:10px;margin:16px 0;flex-wrap:wrap}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:750;color:#615c76}.field input,.field textarea,.field select,.toolbar input,.toolbar select{width:100%;border:1px solid #e3e0ed;background:#fff;border-radius:11px;padding:11px 12px;outline-color:var(--purple)}.toolbar input{flex:1;min-width:180px}.toolbar select{width:auto}.card{display:flex;flex-direction:column;gap:11px;min-height:245px}.cardtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.avatar{width:42px;height:42px;border-radius:14px;background:#eee9ff;color:#6047d4;display:grid;place-items:center;font-weight:850}.pill{background:#f0edff;color:#5b47bd;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;white-space:nowrap}.pill.green{background:#e8f8ef;color:#20834e}.card h3{margin:0;font-size:17px}.card .desc{font-size:13px;flex:1}.meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}.panel{margin-top:18px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.nav button{background:white;border:1px solid var(--line);color:#6c6780;padding:9px 13px;border-radius:11px;font-weight:750}.nav button.active{background:#211c35;color:white}.auth{max-width:480px;margin:38px auto;background:white;border:1px solid var(--line);border-radius:22px;padding:25px}.auth h1{font-size:30px}.switch{display:flex;background:#f2f0f8;border-radius:12px;padding:4px}.switch button{flex:1;background:transparent;padding:9px;border-radius:9px;color:var(--muted)}.switch button.active{background:white;color:var(--ink);box-shadow:0 1px 5px #ddd9e7}.note{font-size:12px;background:#f6f3ff;padding:12px;border-radius:12px;color:#62558f}.empty{padding:32px 12px;text-align:center;color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#211c35;color:white;padding:12px 18px;border-radius:12px;box-shadow:0 8px 30px #0002;z-index:5;max-width:90vw}.actions{display:flex;gap:8px;flex-wrap:wrap}.foot{text-align:center;color:#9894a7;font-size:11px;padding:25px 0}.money{font-weight:850;color:#2d2550}@media(max-width:760px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:17px 13px 60px}.top{padding:17px}.hero{align-items:flex-start;flex-direction:column}.card{padding:13px}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}}@media(max-width:460px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.top small{display:none}.auth{margin:20px auto;padding:20px}.toolbar select{flex:1}}

.landing{max-width:1080px;margin:auto}.landing .hero{min-height:390px;padding:36px 0 25px;align-items:center}.landing .hero>div:first-child{max-width:560px}.landing .hero p{max-width:570px;font-size:16px;line-height:1.7}.landing h1{font-size:clamp(38px,6.2vw,62px);letter-spacing:-2.6px}.heroart{background:linear-gradient(145deg,#21183f,#6b51df);border-radius:28px;min-height:300px;min-width:290px;flex:0 1 370px;padding:23px;display:flex;flex-direction:column;justify-content:center;gap:12px;position:relative;overflow:hidden;box-shadow:0 20px 60px #4d3c9b22}.heroart:before,.heroart:after{content:"";position:absolute;border:1px solid #ffffff30;border-radius:50%;width:280px;height:280px;right:-110px;top:-100px}.heroart:after{width:190px;height:190px;right:-65px;top:-50px}.artbadge{color:#e4ddff;font-size:12px;font-weight:800;letter-spacing:.7px;position:relative;z-index:1}.artmetric{background:#ffffff18;border:1px solid #ffffff24;border-radius:15px;padding:13px 15px;color:#f5f2ff;position:relative;z-index:1}.artmetric span{display:block;font-size:11px;color:#d5cdfb}.artmetric strong{font-size:17px}.artshine{font-size:34px;color:white;font-weight:900;letter-spacing:-2px;position:absolute;right:20px;bottom:13px;opacity:.18}.artshine span{color:#c5b8ff}.landingstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 55px}.landingstats>div{background:white;border:1px solid var(--line);border-radius:16px;padding:18px}.landingstats strong,.landingstats span{display:block}.landingstats strong{font-size:18px}.landingstats span{font-size:13px;color:var(--muted);margin-top:5px}.landingsection{margin:55px 0}.landingsection>h2,.pricing h2{font-size:clamp(25px,4vw,36px);margin:8px 0}.feature{min-height:185px}.feature .avatar{font-size:13px}.campaignslanding{background:#f0edfb;border-radius:24px;padding:25px}.pricing{text-align:center;padding:35px 0}.pricecard{max-width:390px;margin:24px auto;background:white;border:1px solid var(--line);border-radius:22px;padding:25px;text-align:left;box-shadow:0 16px 50px #2119420b}.pricenum{font-size:42px;font-weight:900;letter-spacing:-2px;margin:14px 0}.pricenum small{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:0}.pricecard ul{padding-left:20px;color:#615c76;line-height:2}.pricecard .btn{width:100%}.cta{background:#211942;color:white;padding:25px;border-radius:22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.cta h2{margin:0;font-size:25px}.cta p{color:#d4cfee}.foot a{color:#77718f;text-decoration:none;margin:0 5px}
@media(max-width:760px){.landing .hero{padding:18px 0;gap:20px}.heroart{min-width:0;width:100%;min-height:220px;flex:auto}.landingstats{margin-bottom:35px}.landingsection{margin:38px 0}.campaignslanding{padding:16px}.cta{align-items:flex-start;flex-direction:column}}
@media(max-width:460px){.landing h1{font-size:39px}.landingstats>div{padding:12px}.landingstats strong{font-size:15px}.landingstats span{font-size:11px}.heroart{display:none}}
</style></head><body><header class="top"><div class="brand">collab<b>zy</b> ✦</div><small>Creator partnerships. Real opportunities.</small><button id="accountBtn" class="btn alt hidden" onclick="logout()">Sign out</button></header><main id="root" class="wrap"><div class="empty">Loading Collabzy…</div></main><div id="toast" class="toast hidden"></div><script>
const API=(window.COLLABZY_API_BASE||((location.protocol==='capacitor:'||(location.hostname==='localhost'&&!location.port))?'https://collabzy-api.onrender.com/api':'/api')).replace(/\/$/,'');
let token=localStorage.getItem('collabzy_token')||'',me=null,role='creator',mode='login',campaigns=[],page='discover',apps=[];
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts={}){const r=await fetch(API+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed. Please try again.');return d}
function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),2600)}
function renderLanding(){
  $('#accountBtn').classList.add('hidden');
  $('#root').innerHTML='<section class="landing"><div class="hero"><div><div class="eyebrow">CREATORS × BRANDS × OPPORTUNITY</div><h1>Turn your creativity<br>into collaborations.</h1><p>One place to discover brand campaigns, pitch your ideas, and manage every collaboration from first hello to final deliverable.</p><div class="actions" style="margin-top:18px"><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Join as a creator →</button><button class="btn alt" onclick="mode=\'register\';role=\'brand\';auth()">I\'m a brand</button></div><p style="font-size:12px;margin-top:12px">Free to explore. No payment details required to create an account.</p></div><div class="heroart"><div class="artbadge">✦ Creator opportunities</div><div class="artmetric"><span>Campaign types</span><strong>Paid · Barter · Hybrid</strong></div><div class="artmetric"><span>Built for both sides</span><strong>Creators + Brands</strong></div><div class="artshine">collab<span>zy</span></div></div></div><div class="landingstats"><div><strong>Discover</strong><span>Find campaigns that fit your niche</span></div><div><strong>Pitch</strong><span>Apply with your own proposal</span></div><div><strong>Manage</strong><span>Track every application status</span></div></div><section class="landingsection"><div class="eyebrow">HOW IT WORKS</div><h2>Good partnerships start here.</h2><div class="grid"><article class="card feature"><div class="avatar">01</div><h3>Discover opportunities</h3><p class="desc">Explore brand campaigns by category, collaboration type and budget.</p></article><article class="card feature"><div class="avatar">02</div><h3>Make your pitch</h3><p class="desc">Share your idea and proposed rate directly with the brand.</p></article><article class="card feature"><div class="avatar">03</div><h3>Build relationships</h3><p class="desc">Brands review applicants and manage acceptance from one workspace.</p></article></div></section><section class="landingsection campaignslanding"><div class="eyebrow">REAL OPPORTUNITIES</div><h2>Explore the marketplace</h2><p>Browse opportunities now. Create an account to apply or publish a campaign.</p><div id="publicCampaigns" class="grid"><div class="empty">Loading campaigns…</div></div></section><section class="pricing"><div class="eyebrow">SIMPLE, CREATOR-FRIENDLY PRICING</div><h2>More collaborations. Less friction.</h2><p>Our planned creator membership is ₹299 per year.</p><div class="pricecard"><span class="pill">PLANNED PLAN</span><div class="pricenum">₹299 <small>/ year</small></div><ul><li>Creator campaign discovery</li><li>Application status tracking</li><li>Creator profile and niche</li><li>Instagram insights when Meta access is configured</li></ul><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Create your free account</button><p style="font-size:11px">Paid membership checkout is not live yet; no payment will be collected.</p></div></section><section class="cta"><div><h2>Your next collaboration could start today.</h2><p>Join Collabzy and take the next step in your creator journey.</p></div><button class="btn" onclick="mode=\'register\';role=\'creator\';auth()">Get started →</button></section><div class="foot">© 2026 Collabzy · <a href="/privacy.html">Privacy</a> · <a href="/terms.html">Terms</a> · <a href="mailto:support@collabzy.app">Contact</a><br>Instagram features depend on official Meta permissions. Campaign examples may be illustrative.</div></section>';
  api('/campaigns').then(d=>{const el=$('#publicCampaigns');if(!el)return;const cs=(d.campaigns||[]).slice(0,3);el.innerHTML=cs.length?cs.map(c=>'<article class="card"><div class="cardtop"><div class="avatar">'+esc((c.brand_name||'B').slice(0,1).toUpperCase())+'</div><span class="pill '+(c.collaboration_type==='Paid'?'green':'')+'">'+esc(c.collaboration_type)+'</span></div><div><h3>'+esc(c.title)+'</h3><p>'+esc(c.brand_name)+' · '+esc(c.category)+'</p></div><div class="desc">'+esc(c.description)+'</div><div class="meta"><span>📍 '+esc(c.location||'India')+'</span><span class="money">'+money(c.budget_min,c.budget_max)+'</span></div><button class="btn alt" onclick="mode=\'register\';role=\'creator\';auth()">Join to apply</button></article>').join(''):'<div class="empty">Campaigns will appear here as brands join.</div>'}).catch(()=>{const el=$('#publicCampaigns');if(el)el.innerHTML='<div class="empty">Marketplace is waking up. Please check back shortly.</div>'});
}
function auth(){ $('#accountBtn').classList.add('hidden');$('#root').innerHTML=`<section class="auth"><div class="eyebrow">THE CREATOR ECONOMY, CONNECTED</div><h1>${mode==='login'?'Welcome back.':'Join Collabzy.'}</h1><p>${mode==='login'?'Find your next great brand collaboration.':'Create a creator or brand account in minutes.'}</p><div class="switch"><button class="${role==='creator'?'active':''}" onclick="setRole('creator')">I'm a creator</button><button class="${role==='brand'?'active':''}" onclick="setRole('brand')">I'm a brand</button></div><form id="authForm">${mode==='register'?'<div class="field"><label>Name / brand name</label><input name="name" required maxlength="80" placeholder="Your name"></div>':''}<div class="field"><label>Email</label><input name="email" type="email" autocomplete="email" required placeholder="you@example.com"></div><div class="field"><label>Password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="${mode==='login'?'current-password':'new-password'}" placeholder="At least 8 characters"></div><button class="btn" style="width:100%;margin-top:7px">${mode==='login'?'Sign in →':'Create account →'}</button></form><p style="text-align:center;margin-top:18px">${mode==='login'?'New here?':'Already have an account?'} <button class="btn alt" onclick="mode='${mode==='login'?'register':'login'}';auth()">${mode==='login'?'Create account':'Sign in'}</button></p><div class="note">Instagram insights require official Meta authorization. Payments are not enabled in this build.</div></section>`;$('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/auth/'+mode,{method:'POST',body:JSON.stringify({name:f.get('name'),email:f.get('email'),password:f.get('password'),role})});token=d.token;me=d.user;localStorage.setItem('collabzy_token',token);await boot()}catch(err){toast(err.message)}}}
function setRole(r){role=r;auth()}
function logout(){token='';me=null;localStorage.removeItem('collabzy_token');mode='login';auth()}
function money(a,b){return a&&b?'₹'+Number(a).toLocaleString('en-IN')+'–₹'+Number(b).toLocaleString('en-IN'):a?'From ₹'+Number(a).toLocaleString('en-IN'):b?'Up to ₹'+Number(b).toLocaleString('en-IN'):'Barter / negotiable'}
function card(c){return `<article class="card"><div class="cardtop"><div class="avatar">${esc((c.brand_name||'B').slice(0,1).toUpperCase())}</div><span class="pill ${c.collaboration_type==='Paid'?'green':''}">${esc(c.collaboration_type)}</span></div><div><h3>${esc(c.title)}</h3><p>${esc(c.brand_name)} · ${esc(c.category)}</p></div><div class="desc">${esc(c.description)}</div><div class="meta"><span>📍 ${esc(c.location||'India')}</span><span class="money">${money(c.budget_min,c.budget_max)}</span></div><div class="meta"><span>Deliverables</span><b>${esc(c.deliverables||'Discuss with brand')}</b></div><button class="btn" onclick="applyCampaign(${c.id})">${me.role==='creator'?'Apply to campaign':'View campaign'}</button></article>`}
async function loadCampaigns(){const d=await api('/campaigns');campaigns=d.campaigns||[]}
function shell(){ $('#accountBtn').classList.remove('hidden');$('#root').innerHTML=`<div class="hero"><div><div class="eyebrow">YOUR NEXT COLLAB STARTS HERE</div><h1>Make your influence<br>work for you.</h1><p>Discover paid campaigns, barter deals and long-term brand partnerships.</p></div><div class="actions">${me.role==='brand'?'<button class="btn" onclick="newCampaign()">＋ Post a campaign</button>':''}<button class="btn alt" onclick="go('profile')">My profile</button></div></div><div class="stats"><div class="stat"><strong>${campaigns.length}</strong><span>Active campaigns</span></div><div class="stat"><strong>${apps.length}</strong><span>My applications</span></div><div class="stat"><strong>${apps.filter(a=>a.status==='accepted').length}</strong><span>Accepted</span></div></div><nav class="nav"><button class="${page==='discover'?'active':''}" onclick="go('discover')">Discover</button><button class="${page==='applications'?'active':''}" onclick="go('applications')">Applications</button><button class="${page==='instagram'?'active':''}" onclick="go('instagram')">Instagram</button><button class="${page==='profile'?'active':''}" onclick="go('profile')">Profile</button></nav><section id="view"></section><div class="foot">Collabzy · Built for creators and brands · Be genuine. Create impact.</div>`;renderPage()}
async function go(p){page=p;renderPage()}
function renderPage(){const v=$('#view');if(!v)return;if(page==='discover'){v.innerHTML=`<h2>Campaign marketplace</h2><p>Find opportunities that fit your niche.</p><div class="toolbar"><input id="q" placeholder="Search campaigns or brands…"><select id="type"><option>All</option><option>Paid</option><option>Barter</option><option>Hybrid</option></select><button class="btn" onclick="filter()">Search</button></div><div id="campaignGrid" class="grid">${campaigns.length?campaigns.map(card).join(''):'<div class="empty">No campaigns yet. Brands can publish the first opportunity.</div>'}</div>`;return}
if(page==='applications'){v.innerHTML='<h2>Application tracker</h2><p>Follow every pitch from submitted to accepted.</p><div class="panel" id="appList">Loading…</div>';loadApps().then(()=>{if(page!=='applications')return;$('#appList').innerHTML=apps.length?apps.map(a=>`<div style="padding:13px 0;border-bottom:1px solid var(--line)"><b>${esc(a.campaign_title||'Campaign')}</b><p>${esc(a.brand_name||a.creator_name||'Collab')} · <span class="pill">${esc(a.status)}</span></p>${me.role==='brand'&&a.status==='pending'?'<div class="actions"><button class="btn" onclick="updateApp('+a.id+',\'accepted\')">Accept</button><button class="btn alt" onclick="updateApp('+a.id+',\'declined\')">Decline</button></div>':''}</div>`).join(''):'<div class="empty">No applications yet.</div>'});return}
if(page==='instagram'){v.innerHTML='<div class="panel"><div class="eyebrow">OFFICIAL ACCOUNT CONNECTION</div><h2>Connect Instagram</h2><p>Use Meta-authorized account access to retrieve insights that your account and permissions allow.</p><div class="note" style="margin:16px 0">Live connection is not enabled until Meta app credentials, OAuth callback and approved permissions are configured. We never scrape private follower data.</div><button class="btn" onclick="instagramConnect()">Check connection</button><div id="igStatus" style="margin-top:15px"></div></div>';return}
if(page==='profile'){v.innerHTML=`<div class="panel"><h2>Your creator / brand profile</h2><p>Keep your details current so partnerships can find you.</p><form id="profileForm"><div class="field"><label>Name</label><input name="name" required value="${esc(me.name)}"></div><div class="field"><label>Niche</label><input name="niche" value="${esc(me.niche||'')}" placeholder="Beauty, food, fitness…"></div><div class="field"><label>Location</label><input name="location" value="${esc(me.location||'')}" placeholder="City, country"></div><div class="field"><label>Instagram handle (without @)</label><input name="instagram_handle" value="${esc(me.instagram_handle||'')}" placeholder="yourhandle"></div><div class="field"><label>Bio</label><textarea name="bio" rows="3" maxlength="500">${esc(me.bio||'')}</textarea></div><button class="btn">Save profile</button></form></div>`;$('#profileForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));try{me=(await api('/me',{method:'PATCH',body:JSON.stringify(d)})).user;toast('Profile saved');shell()}catch(err){toast(err.message)}}}}
function filter(){const q=($('#q').value||'').toLowerCase(),t=$('#type').value;const list=campaigns.filter(c=>(!q||[c.title,c.brand_name,c.description,c.category].join(' ').toLowerCase().includes(q))&&(t==='All'||c.collaboration_type===t));$('#campaignGrid').innerHTML=list.length?list.map(card).join(''):'<div class="empty">No matching campaigns. Try another search.</div>'}
async function loadApps(){try{apps=(await api('/applications')).applications||[]}catch{apps=[]}}
async function applyCampaign(id){if(me.role!=='creator'){const c=campaigns.find(x=>Number(x.id)===Number(id));toast(c?'Campaign: '+c.title+' · Use Post a campaign to publish your own.':'Brand workspace');return}const pitch=prompt('Tell the brand why you are a good fit (optional):','');if(pitch===null)return;const rate=prompt('Your proposed rate in INR (0 if barter / negotiable):','0');if(rate===null)return;try{await api('/campaigns/'+id+'/apply',{method:'POST',body:JSON.stringify({pitch,proposed_rate:Number(rate)||0})});toast('Application sent!');await loadApps();shell()}catch(e){toast(e.message)}}
async function updateApp(id,status){try{await api('/applications/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await loadApps();renderPage();toast('Application updated')}catch(e){toast(e.message)}}
function newCampaign(){const title=prompt('Campaign title');if(!title)return;const category=prompt('Category (Beauty, Food, Fashion, Fitness, Travel, Tech)')||'Lifestyle';const description=prompt('Describe the collaboration');if(!description)return;const type=prompt('Type: Paid, Barter, or Hybrid','Paid');if(!['Paid','Barter','Hybrid'].includes(type)){toast('Choose Paid, Barter or Hybrid');return}const low=Number(prompt('Minimum budget in INR','3000'))||0,high=Number(prompt('Maximum budget in INR','10000'))||0,deliverables=prompt('Deliverables','1 Reel + 3 Stories')||'';api('/campaigns',{method:'POST',body:JSON.stringify({title,category,description,collaboration_type:type,budget_min:low,budget_max:Math.max(low,high),deliverables,location:'India'})}).then(async()=>{toast('Campaign published');await loadCampaigns();shell()}).catch(e=>toast(e.message))}
async function instagramConnect(){try{const d=await api('/instagram/status');$('#igStatus').innerHTML='<span class="pill">'+esc(d.connected?'Connected':d.mode==='oauth-configured'?'Ready for authorization':'Setup required')+'</span><p>'+esc(d.message||'Status checked')+'</p>'}catch(e){$('#igStatus').textContent=e.message}}
async function boot(){try{if(!token){renderLanding();return}const d=await api('/me');me=d.user;await Promise.all([loadCampaigns(),loadApps()]);shell()}catch(e){token='';localStorage.removeItem('collabzy_token');auth();toast('Please sign in again.')}}
boot();
</script></body></html>
